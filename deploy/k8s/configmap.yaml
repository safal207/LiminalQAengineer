apiVersion: v1
kind: ConfigMap
metadata:
  name: liminalqa-config
  namespace: liminalqa
  labels:
    app.kubernetes.io/name: liminalqa
data:
  RUST_LOG: "info"
  LIMINAL_BIND_ADDR: "0.0.0.0:8080"
  LIMINAL_DB_PATH: "/data/liminaldb"
  LIMINAL_GRPC_ADDR: "0.0.0.0:50051"
  LIMINAL_RATE_LIMIT_RPS: "1000"
