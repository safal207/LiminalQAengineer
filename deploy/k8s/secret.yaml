# Secret template — replace placeholder values before applying.
# Generate a token: openssl rand -hex 32
#
# Apply:
#   kubectl create secret generic liminalqa-secrets \
#     --namespace liminalqa \
#     --from-literal=api-token="$(openssl rand -hex 32)"
#
# Or apply this file after base64-encoding your values:
#   echo -n 'your-token' | base64
apiVersion: v1
kind: Secret
metadata:
  name: liminalqa-secrets
  namespace: liminalqa
  labels:
    app.kubernetes.io/name: liminalqa
type: Opaque
data:
  # REPLACE: echo -n '<your-token>' | base64
  api-token: REPLACE_WITH_BASE64_TOKEN
