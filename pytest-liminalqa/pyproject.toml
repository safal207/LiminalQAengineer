[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-liminalqa"
version = "0.1.0"
description = "pytest plugin for LiminalQA test intelligence — sends results to ingest API"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["pytest", "testing", "liminalqa", "flaky-tests", "test-analytics"]
dependencies = [
    "pytest>=7.0",
    "requests>=2.28",
]

[project.entry-points."pytest11"]
liminalqa = "pytest_liminalqa.plugin"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "requests-mock>=1.11",
    "pytest-mock>=3.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_liminalqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
