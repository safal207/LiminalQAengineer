name: Airbnb Garden Layered Live Probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/airbnb-garden-liminalos-comparison-v0-1
    paths:
      - .github/workflows/airbnb-garden-layered-live-probe.yml
  pull_request:
    branches:
      - agent/airbnb-currency-history-lotus-result-v0-1
    paths:
      - .github/workflows/airbnb-garden-layered-live-probe.yml

permissions:
  contents: read

concurrency:
  group: airbnb-garden-layered-live-${{ github.ref }}
  cancel-in-progress: true

env:
  GARDEN_SHA: 4fd36bc2748c6f5c48b3f6967072d09ee478699f
  PROBE_SHA: c89aa1ae920e1254b668aebfdf0a8c04e3c2738e
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright/python:v1.60.0-noble
  LISTING_URL: https://www.airbnb.com/rooms/1418689551881927394

jobs:
  probe:
    name: Read-only Playwright probe inside Garden
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout comparison branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact fixed Garden source
        uses: actions/checkout@v4
        with:
          repository: safal207/GardenLiminal
          ref: ${{ env.GARDEN_SHA }}
          path: vendor/GardenLiminal
          persist-credentials: false

      - name: Checkout exact Airbnb probe source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.PROBE_SHA }}
          path: vendor/airbnb-probe
          persist-credentials: false

      - name: Verify exact source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/GardenLiminal rev-parse HEAD)" = "$GARDEN_SHA"
          test "$(git -C vendor/airbnb-probe rev-parse HEAD)" = "$PROBE_SHA"
          test -f vendor/airbnb-probe/scripts/airbnb_readonly_probe.py
          test -f vendor/airbnb-probe/scripts/airbnb_readonly_probe_guard.py
          test -f vendor/airbnb-probe/scripts/airbnb_readonly_discovered_dates_probe.py
          test -f vendor/airbnb-probe/scripts/airbnb_readonly_discovered_dates_probe_v4.py

      - name: Prepare directories and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            reports/airbnb-garden-live/rootfs \
            reports/airbnb-garden-live/garden-image \
            reports/airbnb-garden-live/probe-image \
            reports/airbnb-garden-live/evidence
          sudo apt-get update -qq
          sudo apt-get install -y -qq libseccomp-dev pkg-config

      - name: Build and test fixed Garden
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/GardenLiminal-airbnb"
          rm -rf "$build_root"
          cp -a "$GITHUB_WORKSPACE/vendor/GardenLiminal" "$build_root"
          test "$(git -C "$build_root" rev-parse HEAD)" = "$GARDEN_SHA"
          cd "$build_root"
          cargo build --release \
            2>&1 | tee "$GITHUB_WORKSPACE/reports/airbnb-garden-live/cargo-build.log"
          cargo test \
            2>&1 | tee "$GITHUB_WORKSPACE/reports/airbnb-garden-live/cargo-test.log"
          cp target/release/gl "$GITHUB_WORKSPACE/reports/airbnb-garden-live/garden-image/gl"

      - name: Build pinned Playwright probe rootfs image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PLAYWRIGHT_IMAGE"
          docker image inspect "$PLAYWRIGHT_IMAGE" \
            --format '{{json .RepoDigests}}' \
            > reports/airbnb-garden-live/playwright-image-digests.json

          cat > reports/airbnb-garden-live/probe-image/Dockerfile <<DOCKERFILE
          FROM ${PLAYWRIGHT_IMAGE}
          RUN python -m pip install --no-cache-dir playwright==1.60.0
          DOCKERFILE
          docker build \
            --tag airbnb-garden-probe:${GITHUB_SHA} \
            reports/airbnb-garden-live/probe-image \
            2>&1 | tee reports/airbnb-garden-live/probe-image-build.log

      - name: Export Playwright rootfs and install exact probe scripts
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create airbnb-garden-probe:${GITHUB_SHA} /bin/true)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker export "$container_id" \
            -o reports/airbnb-garden-live/playwright-rootfs.tar
          sudo tar -xf reports/airbnb-garden-live/playwright-rootfs.tar \
            -C reports/airbnb-garden-live/rootfs

          sudo mkdir -p \
            reports/airbnb-garden-live/rootfs/opt/liminalqa \
            reports/airbnb-garden-live/rootfs/evidence
          sudo cp \
            vendor/airbnb-probe/scripts/airbnb_readonly_probe.py \
            vendor/airbnb-probe/scripts/airbnb_readonly_probe_guard.py \
            vendor/airbnb-probe/scripts/airbnb_readonly_discovered_dates_probe.py \
            vendor/airbnb-probe/scripts/airbnb_readonly_discovered_dates_probe_v4.py \
            reports/airbnb-garden-live/rootfs/opt/liminalqa/
          sudo chmod -R a+rX reports/airbnb-garden-live/rootfs/opt/liminalqa
          test -x reports/airbnb-garden-live/rootfs/usr/bin/python3

      - name: Build Garden harness image
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/airbnb-garden-live/garden-image/Dockerfile <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                   libseccomp2 ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          COPY gl /opt/garden/gl
          RUN chmod 0755 /opt/garden/gl
          ENTRYPOINT ["/opt/garden/gl"]
          DOCKERFILE
          docker build \
            --tag garden-airbnb-live:${GITHUB_SHA} \
            reports/airbnb-garden-live/garden-image \
            2>&1 | tee reports/airbnb-garden-live/garden-image-build.log

      - name: Prepare bounded Airbnb Garden Seed
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/airbnb-garden-live/seed.yaml <<YAML
          apiVersion: v0
          kind: Seed
          meta:
            name: airbnb-readonly-playwright
            id: airbnb-readonly-playwright-001
          rootfs:
            path: /work/rootfs
          entrypoint:
            cmd:
              - /usr/bin/python3
              - /opt/liminalqa/airbnb_readonly_discovered_dates_probe_v4.py
              - --listing-url
              - ${LISTING_URL}
              - --output-root
              - /evidence/ABNB-GARDEN-ANTALYA
            env:
              - PYTHONPATH=/opt/liminalqa
              - HOME=/tmp
              - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
              - PYTHONUNBUFFERED=1
            cwd: /opt/liminalqa
          mounts:
            - type: proc
              target: /proc
            - type: tmpfs
              target: /tmp
            - type: tmpfs
              target: /dev/shm
          security:
            hostname: airbnb-garden
            drop_caps: ["NET_ADMIN", "SYS_ADMIN"]
            seccomp_profile: default
          user:
            uid: 0
            gid: 0
            map_rootless: false
          store:
            kind: mem
          YAML

      - name: Inspect exact Garden Seed
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/reports/airbnb-garden-live/seed.yaml:/work/seed.yaml:ro" \
            garden-airbnb-live:${GITHUB_SHA} \
            inspect -f /work/seed.yaml \
            2>&1 | tee reports/airbnb-garden-live/inspect.log

      - name: Run live read-only probe inside Garden
        shell: bash
        run: |
          set -uo pipefail
          container_name="airbnb-garden-live-${GITHUB_RUN_ID}"
          docker rm -f "$container_name" >/dev/null 2>&1 || true

          set +e
          timeout 900 docker run \
            --name "$container_name" \
            --privileged \
            --cpus 1.50 \
            --memory 2g \
            --pids-limit 512 \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE/reports/airbnb-garden-live/rootfs:/work/rootfs:rw" \
            -v "$GITHUB_WORKSPACE/reports/airbnb-garden-live/seed.yaml:/work/seed.yaml:ro" \
            garden-airbnb-live:${GITHUB_SHA} \
            run -f /work/seed.yaml --store mem \
            > reports/airbnb-garden-live/run.log 2>&1
          code=$?
          set -e

          echo "$code" > reports/airbnb-garden-live/run.exit
          docker inspect "$container_name" \
            > reports/airbnb-garden-live/docker-inspect.json
          docker inspect "$container_name" \
            --format '{{json .HostConfig}}' \
            > reports/airbnb-garden-live/docker-host-config.json
          docker rm -f "$container_name" >/dev/null
          tail -200 reports/airbnb-garden-live/run.log

      - name: Extract Garden-produced Airbnb evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_dir=reports/airbnb-garden-live/rootfs/evidence/ABNB-GARDEN-ANTALYA
          if [ -d "$source_dir" ]; then
            sudo cp -a "$source_dir" reports/airbnb-garden-live/evidence/
            sudo chown -R "$(id -u):$(id -g)" reports/airbnb-garden-live/evidence
          fi

      - name: Build live Garden comparison result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('reports/airbnb-garden-live')
          exit_code = int((root / 'run.exit').read_text().strip())
          host_config = json.loads((root / 'docker-host-config.json').read_text())

          records = []
          for raw in (root / 'run.log').read_text(errors='replace').splitlines():
              raw = raw.strip()
              if not raw.startswith('{'):
                  continue
              try:
                  value = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict) and value.get('event'):
                  records.append(value)

          events = [item['event'] for item in records]
          required = [
              'RUN_CREATED', 'SEED_LOADED', 'NS_CREATED', 'MOUNT_DONE',
              'CAPS_DROPPED', 'SECCOMP_ENABLED', 'PROCESS_START', 'PROCESS_EXIT',
          ]
          missing = [event for event in required if event not in events]
          garden_exit_zero = any(
              item.get('event') == 'PROCESS_EXIT' and item.get('code') == 0
              for item in records
          )

          probe_paths = list((root / 'evidence').rglob('probe-result.json'))
          probe = None
          if len(probe_paths) == 1:
              probe = json.loads(probe_paths[0].read_text())

          outer_limits = {
              'nano_cpus': host_config.get('NanoCpus'),
              'memory_bytes': host_config.get('Memory'),
              'pids_limit': host_config.get('PidsLimit'),
          }
          expected_limits = {
              'nano_cpus': 1_500_000_000,
              'memory_bytes': 2_147_483_648,
              'pids_limit': 512,
          }

          safe_probe = bool(probe) and all([
              probe.get('confirmed_defect') is False,
              probe.get('payment_submitted') is False,
              probe.get('reservation_created') is False,
          ])
          infrastructure_confirmed = (
              exit_code == 0
              and not missing
              and garden_exit_zero
              and outer_limits == expected_limits
              and safe_probe
          )

          result = {
              'schema_version': 'airbnb-garden-layered-live-result-v0.1',
              'garden_commit': '4fd36bc2748c6f5c48b3f6967072d09ee478699f',
              'probe_commit': 'c89aa1ae920e1254b668aebfdf0a8c04e3c2738e',
              'target': 'https://www.airbnb.com/rooms/1418689551881927394',
              'garden_events': events,
              'missing_garden_events': missing,
              'garden_process_exit_zero': garden_exit_zero,
              'docker_exit_code': exit_code,
              'outer_docker_limits': {
                  'configured': outer_limits,
                  'expected': expected_limits,
                  'matches': outer_limits == expected_limits,
              },
              'probe_result_present': probe is not None,
              'probe_summary': None if probe is None else {
                  'classifier_revision': probe.get('classifier_revision'),
                  'outcomes': probe.get('outcomes'),
                  'normalized_signatures': probe.get('normalized_signatures'),
                  'evidence_grade': probe.get('evidence_grade'),
                  'confirmed_defect': probe.get('confirmed_defect'),
                  'payment_submitted': probe.get('payment_submitted'),
                  'reservation_created': probe.get('reservation_created'),
                  'resolved_target': probe.get('resolved_target'),
                  'reload_outcome': (probe.get('reload_probe') or {}).get('outcome'),
              },
              'safe_readonly_probe': safe_probe,
              'infrastructure_confirmed': infrastructure_confirmed,
              'truth_boundary': [
                  'Docker applies CPU, memory, and PID limits; Garden applies namespaces, pivot_root, capability dropping, seccomp, and lifecycle evidence.',
                  'The run is a public unauthenticated read-only browser observation.',
                  'A live inconsistent signal is not a confirmed product defect without separate Lotus adjudication.',
                  'No login, form submission, host contact, payment, or reservation is permitted.',
              ],
              'authority': {
                  'mode': 'audit_only',
                  'ownership': False,
                  'approval': False,
                  'external_submission': False,
                  'merge': False,
              },
          }
          (root / 'result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2))
          if not infrastructure_confirmed:
              raise SystemExit(1)
          PY

      - name: Remove disposable Playwright rootfs
        if: always()
        shell: bash
        run: |
          sudo rm -rf reports/airbnb-garden-live/rootfs
          rm -f reports/airbnb-garden-live/playwright-rootfs.tar

      - name: Build exact SHA manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find reports/airbnb-garden-live -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > reports/airbnb-garden-live/SHA256SUMS.txt

      - name: Upload live Garden evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airbnb-garden-layered-live-${{ github.run_id }}
          path: reports/airbnb-garden-live/
          if-no-files-found: error
          retention-days: 14
