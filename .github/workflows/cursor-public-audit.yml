name: Cursor Public Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ai-coding-companies-public-audit-v0-1
    paths:
      - .github/workflows/cursor-public-audit.yml
      - .github/workflows/company-public-audit.yml
      - audits/companies/cursor/public-audit.json
      - scripts/company_public_audit_engine.py
      - scripts/company_public_browser_probe.mjs
  pull_request:
    branches:
      - agent/company-self-service-audit-v0-1
    paths:
      - .github/workflows/cursor-public-audit.yml
      - .github/workflows/company-public-audit.yml
      - audits/companies/cursor/public-audit.json
      - scripts/company_public_audit_engine.py
      - scripts/company_public_browser_probe.mjs

permissions:
  contents: read

concurrency:
  group: cursor-public-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Cursor bounded public audit
    uses: ./.github/workflows/company-public-audit.yml
    with:
      config_path: audits/companies/cursor/public-audit.json
      engine_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      retention_days: 30
      fail_on: never
