name: Impact Selector Format Artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/impact-selector-format-artifact.yml
      - liminalqa-runner/src/impact.rs
      - liminalqa-runner/src/lib.rs
      - liminalqa-runner/examples/impact_selector.rs

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format exact branch content
        run: cargo fmt --all
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: impact-selector-rustfmt-${{ github.run_id }}
          path: |
            liminalqa-runner/src/impact.rs
            liminalqa-runner/src/lib.rs
            liminalqa-runner/examples/impact_selector.rs
          if-no-files-found: error
          retention-days: 1
