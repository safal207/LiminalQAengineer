name: Bell Integrator Outside-In Audit v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/bell-integrator-outside-in-audit-v0-1
    paths:
      - .github/workflows/bell-integrator-outside-in-audit-v0-1.yml
      - audits/bell-integrator/public-audit-v0.1/contract.json
      - scripts/bell_integrator_public_audit_probe.py
      - tests/test_bell_integrator_public_audit_probe.py
      - docs/audits/BELL_INTEGRATOR_OUTSIDE_IN_AUDIT_V0_1.md
      - docs/audits/BELL_INTEGRATOR_COLLABORATION_BRIEF.md
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bell-integrator-outside-in-audit-v0-1.yml
      - audits/bell-integrator/public-audit-v0.1/contract.json
      - scripts/bell_integrator_public_audit_probe.py
      - tests/test_bell_integrator_public_audit_probe.py
      - docs/audits/BELL_INTEGRATOR_OUTSIDE_IN_AUDIT_V0_1.md
      - docs/audits/BELL_INTEGRATOR_COLLABORATION_BRIEF.md

permissions:
  contents: read

concurrency:
  group: bell-integrator-outside-in-v0-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate Bell Integrator audit contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate syntax and fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m json.tool audits/bell-integrator/public-audit-v0.1/contract.json >/dev/null
          python3 -m py_compile scripts/bell_integrator_public_audit_probe.py
          python3 scripts/bell_integrator_public_audit_probe.py --validate-only

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_bell_integrator_public_audit_probe.py -v

  observe:
    name: Recheck allowlisted Bell Integrator public content
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run passive sequential audit
        shell: bash
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -rf reports/bell-integrator/public-audit-v0.1
          python3 scripts/bell_integrator_public_audit_probe.py \
            --contract audits/bell-integrator/public-audit-v0.1/contract.json \
            --output-dir reports/bell-integrator/public-audit-v0.1
          cat reports/bell-integrator/public-audit-v0.1/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate evidence and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          result="reports/bell-integrator/public-audit-v0.1/result.json"
          jq -e '
            .schema_version == "liminalqa-bell-integrator-public-audit-result-v1" and
            .target.canonical_origin == "https://bellintegrator.ru" and
            .aggregate.target_count == 6 and
            .aggregate.observed_target_count == 6 and
            .authority.mode == "evidence_only" and
            .authority.grants.ownership == false and
            .authority.grants.approval == false and
            .authority.grants.execution == false and
            .authority.grants.external_submission == false and
            .authority.grants.delivery == false and
            .authority.grants.deployment == false and
            .authority.grants.merge == false and
            .boundaries.public_pages_only == true and
            .boundaries.authentication == false and
            .boundaries.form_submission == false and
            .boundaries.email_or_external_contact == false and
            .boundaries.active_security_testing == false and
            .boundaries.external_submission_authorized == false and
            .boundaries.merge_authorized == false
          ' "${result}" >/dev/null
          ! grep -R -E -i 'authorization:|cookie:|set-cookie:|access_token|refresh_token|sessionid' \
            reports/bell-integrator/public-audit-v0.1

      - name: Record exact attempt and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          output="reports/bell-integrator/public-audit-v0.1"
          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg source_head_sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --arg workflow_sha "${{ github.sha }}" \
            --arg base_sha "${{ github.event.pull_request.base.sha || '' }}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{run_id:$run_id,run_attempt:$run_attempt,source_head_sha:$source_head_sha,workflow_sha:$workflow_sha,base_sha:$base_sha,generated_at:$generated_at}' \
            > "${output}/exact-attempt.json"
          find "${output}" -maxdepth 1 -type f ! -name ARTIFACT_SHA256SUMS.txt -printf '%f\0' \
            | sort -z \
            | while IFS= read -r -d '' file; do (cd "${output}" && sha256sum "${file}"); done \
            > "${output}/ARTIFACT_SHA256SUMS.txt"
          (cd "${output}" && sha256sum -c ARTIFACT_SHA256SUMS.txt)

      - name: Upload exact-attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bell-integrator-outside-in-v0-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/bell-integrator/public-audit-v0.1/
          if-no-files-found: error
          retention-days: 14
