name: LiminalQA Company Public Audit

on:
  workflow_call:
    inputs:
      config_path:
        description: Path to the audit JSON contract in the caller repository
        required: true
        type: string
      engine_ref:
        description: Exact LiminalQAengineer SHA or release tag; use the same ref as the called workflow
        required: false
        default: main
        type: string
      retention_days:
        description: Evidence artifact retention in days
        required: false
        default: 30
        type: number
      fail_on:
        description: never, high, or any-signal
        required: false
        default: never
        type: string
    outputs:
      verdict:
        description: PASS or WARN
        value: ${{ jobs.aggregate.outputs.verdict }}
      severity:
        description: NONE, LOW, MEDIUM, or HIGH
        value: ${{ jobs.aggregate.outputs.severity }}
      artifact_name:
        description: Aggregate evidence artifact name
        value: ${{ jobs.aggregate.outputs.artifact_name }}
      result_sha256:
        description: SHA-256 of the aggregate machine-readable result
        value: ${{ jobs.aggregate.outputs.result_sha256 }}
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to a committed audit JSON contract
        required: true
        default: audits/templates/company-public-audit.example.json
        type: string
      engine_ref:
        description: Exact LiminalQAengineer SHA, release tag, or branch
        required: true
        default: main
        type: string
      retention_days:
        description: Evidence artifact retention in days
        required: true
        default: 30
        type: number
      fail_on:
        description: Gate behavior
        required: true
        default: never
        type: choice
        options:
          - never
          - high
          - any-signal

permissions:
  contents: read

concurrency:
  group: liminalqa-company-audit-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ENGINE_REPOSITORY: safal207/LiminalQAengineer
  NODE_OPTIONS: --max-old-space-size=4096
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  prepare:
    name: Validate exact audit contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.contract.outputs.matrix }}
      max_parallel: ${{ steps.contract.outputs.max_parallel }}
      expected_cells: ${{ steps.contract.outputs.expected_cells }}
      config_sha256: ${{ steps.contract.outputs.config_sha256 }}
      engine_sha: ${{ steps.engine.outputs.engine_sha }}
      caller_sha: ${{ steps.caller.outputs.caller_sha }}
      caller_repository: ${{ steps.caller.outputs.caller_repository }}

    steps:
      - name: Validate workflow inputs
        shell: bash
        env:
          FAIL_ON: ${{ inputs.fail_on }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
        run: |
          set -euo pipefail
          case "${FAIL_ON}" in
            never|high|any-signal) ;;
            *) echo "Unsupported fail_on: ${FAIL_ON}" >&2; exit 2 ;;
          esac
          test "${RETENTION_DAYS}" -ge 1
          test "${RETENTION_DAYS}" -le 90

      - name: Checkout exact caller repository
        uses: actions/checkout@v4
        with:
          path: caller
          persist-credentials: false

      - name: Record exact caller identity
        id: caller
        shell: bash
        run: |
          set -euo pipefail
          caller_sha="$(git -C caller rev-parse HEAD)"
          test "${caller_sha}" = "${GITHUB_SHA}"
          echo "caller_sha=${caller_sha}" >> "${GITHUB_OUTPUT}"
          echo "caller_repository=${GITHUB_REPOSITORY}" >> "${GITHUB_OUTPUT}"

      - name: Checkout pinned LiminalQA engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPOSITORY }}
          ref: ${{ inputs.engine_ref }}
          path: engine
          persist-credentials: false

      - name: Record exact engine revision
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          engine_sha="$(git -C engine rev-parse HEAD)"
          echo "engine_sha=${engine_sha}" >> "${GITHUB_OUTPUT}"
          printf 'Engine repository: `%s`\n\nEngine SHA: `%s`\n' \
            "${ENGINE_REPOSITORY}" "${engine_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Resolve config path inside caller checkout
        id: config_path
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path("caller").resolve()
          candidate = (root / os.environ["CONFIG_PATH"]).resolve()
          if candidate != root and root not in candidate.parents:
              raise SystemExit("config_path escapes the caller checkout")
          if not candidate.is_file():
              raise SystemExit(f"config file does not exist: {candidate}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"path={candidate}\n")
          PY

      - name: Validate fail-closed contract and build matrix
        id: contract
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.config_path.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p prepared
          python3 -m py_compile engine/scripts/company_public_audit_engine.py
          node --check engine/scripts/company_public_browser_probe.mjs
          validation="$(python3 engine/scripts/company_public_audit_engine.py validate \
            --config "${CONFIG_FILE}" \
            --output prepared/validated-config.json)"
          matrix_payload="$(python3 engine/scripts/company_public_audit_engine.py matrix \
            --config prepared/validated-config.json)"
          config_sha="$(jq -r '.config_sha256' <<<"${validation}")"
          test "${config_sha}" = "$(jq -r '.config_sha256' <<<"${matrix_payload}")"
          echo "matrix=$(jq -c '{include:.include}' <<<"${matrix_payload}")" >> "${GITHUB_OUTPUT}"
          echo "max_parallel=$(jq -r '.max_parallel' <<<"${matrix_payload}")" >> "${GITHUB_OUTPUT}"
          echo "expected_cells=$(jq -r '.include | length' <<<"${matrix_payload}")" >> "${GITHUB_OUTPUT}"
          echo "config_sha256=${config_sha}" >> "${GITHUB_OUTPUT}"
          jq '{company, targets, profiles, settings, category_thresholds, boundaries}' \
            prepared/validated-config.json >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload validated contract
        uses: actions/upload-artifact@v4
        with:
          name: liminalqa-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared/validated-config.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  audit:
    name: Audit · ${{ matrix.target_id }} · ${{ matrix.profile }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout exact caller revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.caller_sha }}
          path: caller
          persist-credentials: false

      - name: Checkout exact LiminalQA engine revision
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.engine_sha }}
          path: engine
          persist-credentials: false

      - name: Resolve exact caller config path
        id: config_path
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path("caller").resolve()
          candidate = (root / os.environ["CONFIG_PATH"]).resolve()
          if candidate != root and root not in candidate.parents:
              raise SystemExit("config_path escapes the caller checkout")
          if not candidate.is_file():
              raise SystemExit(f"config file does not exist: {candidate}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"path={candidate}\n")
          PY

      - name: Revalidate exact contract and matrix cell
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.config_path.outputs.path }}
          EXPECTED_CONFIG_SHA: ${{ needs.prepare.outputs.config_sha256 }}
          TARGET_ID: ${{ matrix.target_id }}
          TARGET_URL: ${{ matrix.target_url }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          mkdir -p prepared
          validation="$(python3 engine/scripts/company_public_audit_engine.py validate \
            --config "${CONFIG_FILE}" \
            --output prepared/validated-config.json)"
          test "$(jq -r '.config_sha256' <<<"${validation}")" = "${EXPECTED_CONFIG_SHA}"
          jq -e \
            --arg id "${TARGET_ID}" \
            --arg url "${TARGET_URL}" \
            --arg profile "${PROFILE}" \
            '(.targets[] | select(.id == $id and .url == $url)) and (.profiles | index($profile) != null)' \
            prepared/validated-config.json >/dev/null

      - name: Install pinned browser tooling
        run: npm install --no-save --package-lock=false puppeteer-core@24.16.0

      - name: Locate Chrome and validate runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          node --version
          python3 -m py_compile engine/scripts/company_public_audit_engine.py
          node --check engine/scripts/company_public_browser_probe.mjs
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "${chrome}"
          "${chrome}" --version
          echo "chrome=${chrome}" >> "${GITHUB_OUTPUT}"

      - name: Collect passive browser and keyboard evidence
        shell: bash
        run: |
          set -euo pipefail
          output="reports/${{ matrix.cell_id }}"
          rm -rf "${output}"
          mkdir -p "${output}"
          node engine/scripts/company_public_browser_probe.mjs \
            --config prepared/validated-config.json \
            --target-id "${{ matrix.target_id }}" \
            --profile "${{ matrix.profile }}" \
            --chrome "${{ steps.runtime.outputs.chrome }}" \
            --output-dir "${output}"
          cat "${output}/browser-summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Collect pinned Lighthouse evidence
        shell: bash
        env:
          AUDIT_TARGET_URL: ${{ matrix.target_url }}
          AUDIT_PROFILE: ${{ matrix.profile }}
          AUDIT_OUTPUT: reports/${{ matrix.cell_id }}/raw-lighthouse
        run: |
          set -euo pipefail
          mkdir -p "${AUDIT_OUTPUT}"
          export LIGHTHOUSE_RUNS="$(jq -r '.settings.lighthouse_runs' prepared/validated-config.json)"
          cat > lighthouserc.company.cjs <<'EOF'
          const desktop = process.env.AUDIT_PROFILE === "desktop";
          module.exports = {
            ci: {
              collect: {
                url: [process.env.AUDIT_TARGET_URL],
                numberOfRuns: Number(process.env.LIGHTHOUSE_RUNS),
                settings: {
                  onlyCategories: ["performance", "accessibility", "best-practices", "seo"],
                  ...(desktop ? { preset: "desktop" } : {}),
                },
              },
              upload: {
                target: "filesystem",
                outputDir: process.env.AUDIT_OUTPUT,
              },
            },
          };
          EOF
          npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.company.cjs
          python3 engine/scripts/company_public_audit_engine.py summarize-lighthouse \
            --config prepared/validated-config.json \
            --target-id "${{ matrix.target_id }}" \
            --profile "${{ matrix.profile }}" \
            --input-dir "${AUDIT_OUTPUT}" \
            --output-dir "reports/${{ matrix.cell_id }}"
          cat "reports/${{ matrix.cell_id }}/lighthouse-summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Record exact-attempt provenance and hashes
        shell: bash
        run: |
          set -euo pipefail
          output="reports/${{ matrix.cell_id }}"
          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg caller_repository "${{ needs.prepare.outputs.caller_repository }}" \
            --arg caller_sha "${{ needs.prepare.outputs.caller_sha }}" \
            --arg engine_repository "${ENGINE_REPOSITORY}" \
            --arg engine_sha "${{ needs.prepare.outputs.engine_sha }}" \
            --arg config_sha256 "${{ needs.prepare.outputs.config_sha256 }}" \
            --arg cell_id "${{ matrix.cell_id }}" \
            --arg target_id "${{ matrix.target_id }}" \
            --arg target_url "${{ matrix.target_url }}" \
            --arg target_kind "${{ matrix.target_kind }}" \
            --arg profile "${{ matrix.profile }}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              run_id:$run_id,
              run_attempt:$run_attempt,
              caller_repository:$caller_repository,
              caller_sha:$caller_sha,
              engine_repository:$engine_repository,
              engine_sha:$engine_sha,
              config_sha256:$config_sha256,
              cell_id:$cell_id,
              target_id:$target_id,
              target_url:$target_url,
              target_kind:$target_kind,
              profile:$profile,
              generated_at:$generated_at
            }' > "${output}/exact-attempt.json"
          find "${output}" -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > "${output}/SHA256SUMS.txt"

      - name: Upload exact cell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liminalqa-cell-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.cell_id }}
          path: reports/${{ matrix.cell_id }}/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  aggregate:
    name: Aggregate exact company evidence
    needs:
      - prepare
      - audit
    if: always() && needs.prepare.result == 'success' && needs.audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      verdict: ${{ steps.outputs.outputs.verdict }}
      severity: ${{ steps.outputs.outputs.severity }}
      result_sha256: ${{ steps.outputs.outputs.result_sha256 }}
      artifact_name: ${{ steps.outputs.outputs.artifact_name }}

    steps:
      - name: Checkout exact caller revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.caller_sha }}
          path: caller
          persist-credentials: false

      - name: Checkout exact LiminalQA engine revision
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.engine_sha }}
          path: engine
          persist-credentials: false

      - name: Resolve exact caller config path
        id: config_path
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path("caller").resolve()
          candidate = (root / os.environ["CONFIG_PATH"]).resolve()
          if candidate != root and root not in candidate.parents:
              raise SystemExit("config_path escapes the caller checkout")
          if not candidate.is_file():
              raise SystemExit(f"config file does not exist: {candidate}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"path={candidate}\n")
          PY

      - name: Revalidate exact contract
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.config_path.outputs.path }}
          EXPECTED_CONFIG_SHA: ${{ needs.prepare.outputs.config_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p prepared
          validation="$(python3 engine/scripts/company_public_audit_engine.py validate \
            --config "${CONFIG_FILE}" \
            --output prepared/validated-config.json)"
          test "$(jq -r '.config_sha256' <<<"${validation}")" = "${EXPECTED_CONFIG_SHA}"

      - name: Download only this run attempt's cell artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: liminalqa-cell-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: downloaded-cells

      - name: Enforce complete exact-attempt set and aggregate
        shell: bash
        run: |
          set -euo pipefail
          manifest_count="$(find downloaded-cells -name exact-attempt.json -type f | wc -l)"
          test "${manifest_count}" -eq "${{ needs.prepare.outputs.expected_cells }}"
          rm -rf reports/company-audit
          python3 engine/scripts/company_public_audit_engine.py aggregate \
            --config prepared/validated-config.json \
            --input-dir downloaded-cells \
            --output-dir reports/company-audit \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --caller-repository "${{ needs.prepare.outputs.caller_repository }}" \
            --caller-sha "${{ needs.prepare.outputs.caller_sha }}" \
            --engine-sha "${{ needs.prepare.outputs.engine_sha }}"
          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{run_id:$run_id,run_attempt:$run_attempt,generated_at:$generated_at}' \
            > reports/company-audit/aggregate-exact-attempt.json
          find reports/company-audit -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > reports/company-audit/SHA256SUMS.txt
          cat reports/company-audit/company-audit-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Expose reusable workflow outputs
        id: outputs
        shell: bash
        run: |
          set -euo pipefail
          output_json="reports/company-audit/workflow-outputs.json"
          artifact_name="liminalqa-company-audit-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "verdict=$(jq -r '.verdict' "${output_json}")" >> "${GITHUB_OUTPUT}"
          echo "severity=$(jq -r '.severity' "${output_json}")" >> "${GITHUB_OUTPUT}"
          echo "result_sha256=$(jq -r '.result_sha256' "${output_json}")" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload aggregate evidence packet
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.outputs.outputs.artifact_name }}
          path: reports/company-audit/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Apply optional quality gate
        shell: bash
        env:
          FAIL_ON: ${{ inputs.fail_on }}
          VERDICT: ${{ steps.outputs.outputs.verdict }}
          SEVERITY: ${{ steps.outputs.outputs.severity }}
        run: |
          set -euo pipefail
          case "${FAIL_ON}" in
            never)
              exit 0
              ;;
            high)
              test "${SEVERITY}" != "HIGH"
              ;;
            any-signal)
              test "${VERDICT}" = "PASS"
              ;;
            *)
              echo "Unsupported fail_on: ${FAIL_ON}" >&2
              exit 2
              ;;
          esac
