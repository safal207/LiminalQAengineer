name: Airbnb read-only Docker probe

on:
  push:
    branches:
      - agent/abnb-run-002-docker
    paths:
      - scripts/airbnb_readonly_probe.py
      - .github/workflows/airbnb-readonly-docker-probe.yml
  pull_request:
    branches:
      - agent/lotus-evidence-vertical-slice
    paths:
      - scripts/airbnb_readonly_probe.py
      - .github/workflows/airbnb-readonly-docker-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-probe:
    name: readonly-probe-${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slug: antalya-center
            listing_url: 'https://www.airbnb.com/rooms/1418689551881927394?check_in=2026-08-03&check_out=2026-08-04&guests=1&adults=1'
          - slug: alanya-center
            listing_url: 'https://www.airbnb.com/rooms/1411471065836934375?check_in=2026-08-03&check_out=2026-08-04&guests=1&adults=1'
          - slug: alanya-beach
            listing_url: 'https://www.airbnb.com/rooms/928065654314274579?check_in=2026-08-03&check_out=2026-08-04&guests=1&adults=1'
    container:
      image: mcr.microsoft.com/playwright/python:v1.60.0-noble
      options: --ipc=host
    env:
      LISTING_URL: ${{ matrix.listing_url }}
      OUTPUT_ROOT: artifacts/ABNB-MATRIX-${{ matrix.slug }}
      RUN_SLUG: ${{ matrix.slug }}

    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install matching Playwright package
        run: python -m pip install --no-cache-dir playwright==1.60.0

      - name: Record execution boundary
        run: |
          printf '%s\n' \
            "Target: $LISTING_URL" \
            'Public unauthenticated listing only.' \
            'Dates and guest are URL query inputs only.' \
            'No form submission.' \
            'No login.' \
            'No host contact.' \
            'No payment.' \
            'No reservation creation.'

      - name: Run two-context currency and browser-history probe
        run: |
          rm -rf "$OUTPUT_ROOT"
          python scripts/airbnb_readonly_probe.py \
            --listing-url "$LISTING_URL" \
            --output-root "$OUTPUT_ROOT"

      - name: Show compact result
        if: always()
        run: |
          if [ -f "$OUTPUT_ROOT/probe-result.json" ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['OUTPUT_ROOT']) / 'probe-result.json'
          data = json.loads(path.read_text())
          print(json.dumps({
              'slug': os.environ['RUN_SLUG'],
              'target': data['target'],
              'outcomes': data['outcomes'],
              'normalized_signatures': data['normalized_signatures'],
              'evidence_grade': data['evidence_grade'],
              'confirmed_defect': data['confirmed_defect'],
              'payment_submitted': data['payment_submitted'],
              'reservation_created': data['reservation_created'],
          }, indent=2))
          PY
          fi

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ABNB-MATRIX-${{ matrix.slug }}
          path: artifacts/ABNB-MATRIX-${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 14
