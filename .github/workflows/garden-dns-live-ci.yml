name: Garden, Airbnb, LiminalOSAI, and LTP Integrity

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/garden-dns-live-ci.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garden-dns-live-${{ github.ref }}
  cancel-in-progress: true

env:
  GARDEN_SHA: 9c43a78082d8bf943dd8d11e741b9a0c7cc61f65
  PROBE_SHA: c89aa1ae920e1254b668aebfdf0a8c04e3c2738e
  LIMINALOS_SHA: 4f181b6721a9902ffb578afa315105b77737574d
  LTP_SHA: b1fcf43977a2de5cd21b84887d6dcdc1d451acd1
  ROOTFS_IMAGE: mcr.microsoft.com/playwright/python:v1.60.0-noble
  LISTING_URL: https://www.airbnb.com/rooms/1418689551881927394

jobs:
  verify:
    name: Garden probe, LiminalOSAI advisory, and LTP integrity
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: safal207/GardenLiminal
          ref: ${{ env.GARDEN_SHA }}
          path: vendor/GardenLiminal
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.PROBE_SHA }}
          path: vendor/airbnb-probe
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: safal207/LiminalOSAI
          ref: ${{ env.LIMINALOS_SHA }}
          path: vendor/LiminalOSAI
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: safal207/L-THREAD-Liminal-Thread-Secure-Protocol-LTP-
          ref: ${{ env.LTP_SHA }}
          path: vendor/LTP
          persist-credentials: false

      - name: Verify exact source pins and prepare directories
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/GardenLiminal rev-parse HEAD)" = "$GARDEN_SHA"
          test "$(git -C vendor/airbnb-probe rev-parse HEAD)" = "$PROBE_SHA"
          test "$(git -C vendor/LiminalOSAI rev-parse HEAD)" = "$LIMINALOS_SHA"
          test "$(git -C vendor/LTP rev-parse HEAD)" = "$LTP_SHA"
          mkdir -p reports/{rootfs,garden-image,probe-image,evidence,network-files,liminalos,advisory,ltp}
          sudo apt-get update -qq
          sudo apt-get install -y -qq libseccomp-dev pkg-config

      - name: Build and test exact Garden
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/GardenLiminal"
          cp -a vendor/GardenLiminal "$build_root"
          cd "$build_root"
          cargo build --release 2>&1 | tee "$GITHUB_WORKSPACE/reports/cargo-build.log"
          cargo test 2>&1 | tee "$GITHUB_WORKSPACE/reports/cargo-test.log"
          cp target/release/gl "$GITHUB_WORKSPACE/reports/garden-image/gl"

      - name: Build, check, test, and trace exact LiminalOSAI
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/LiminalOSAI
          make 2>&1 | tee "$GITHUB_WORKSPACE/reports/liminalos/build.log"
          make check 2>&1 | tee "$GITHUB_WORKSPACE/reports/liminalos/check.log"
          make test 2>&1 | tee "$GITHUB_WORKSPACE/reports/liminalos/test.log"
          ./build/pulse_kernel \
            --dry-run --limit=2 --trace --coherence --reflect --introspect \
            > "$GITHUB_WORKSPACE/reports/liminalos/runtime.log" 2>&1
          grep -q awareness "$GITHUB_WORKSPACE/reports/liminalos/runtime.log"
          grep -q introspect "$GITHUB_WORKSPACE/reports/liminalos/runtime.log"
          grep -q harmony "$GITHUB_WORKSPACE/reports/liminalos/runtime.log"
          grep -q gate "$GITHUB_WORKSPACE/reports/liminalos/runtime.log"

      - name: Install and test exact LTP lifecycle verifier
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          cd vendor/LTP
          pnpm install --frozen-lockfile --ignore-scripts \
            2>&1 | tee "$GITHUB_WORKSPACE/reports/ltp/install.log"
          pnpm test:lifecycle-integrity \
            2>&1 | tee "$GITHUB_WORKSPACE/reports/ltp/test.log"

      - name: Build exact Playwright rootfs with live network files
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/probe-image/Dockerfile <<DOCKERFILE
          FROM ${ROOTFS_IMAGE}
          RUN python -m pip install --no-cache-dir playwright==1.60.0
          RUN mkdir -p /opt/liminal-playwright && cp -a /ms-playwright/. /opt/liminal-playwright/
          DOCKERFILE
          docker build -t garden-live-rootfs:${GITHUB_SHA} reports/probe-image \
            2>&1 | tee reports/probe-image-build.log

          export_id="$(docker create garden-live-rootfs:${GITHUB_SHA} /bin/true)"
          source_name="network-source-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$export_id" "$source_name" >/dev/null 2>&1 || true' EXIT
          docker export "$export_id" -o reports/rootfs.tar
          sudo tar -xf reports/rootfs.tar -C reports/rootfs

          docker run -d --name "$source_name" garden-live-rootfs:${GITHUB_SHA} sleep 300 >/dev/null
          for file in resolv.conf hosts hostname; do
            docker exec "$source_name" cat "/etc/$file" > "reports/network-files/$file"
            test -s "reports/network-files/$file"
            sudo cp "reports/network-files/$file" "reports/rootfs/etc/$file"
          done

          sudo mkdir -p reports/rootfs/opt/liminalqa reports/rootfs/opt/diagnostic reports/rootfs/evidence
          sudo cp vendor/airbnb-probe/scripts/airbnb_readonly*.py reports/rootfs/opt/liminalqa/
          sudo chmod -R a+rX reports/rootfs/opt/liminalqa

          sudo cp reports/rootfs/opt/liminalqa/airbnb_readonly_discovered_dates_probe.py \
            reports/rootfs/opt/liminalqa/airbnb_readonly_discovered_dates_probe.py.before
          sudo python3 - <<'PY'
          from pathlib import Path
          path = Path('reports/rootfs/opt/liminalqa/airbnb_readonly_discovered_dates_probe.py')
          text = path.read_text()
          marker = 'from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit\n'
          helper = '''\n\ndef copytree_data_only(source: Path, destination: Path) -> None:\n    destination.mkdir(parents=True, exist_ok=False)\n    for item in source.rglob("*"):\n        target = destination / item.relative_to(source)\n        if item.is_dir():\n            target.mkdir(parents=True, exist_ok=True)\n        elif item.is_file():\n            target.parent.mkdir(parents=True, exist_ok=True)\n            with item.open("rb") as src, target.open("wb") as dst:\n                shutil.copyfileobj(src, dst)\n'''
          if marker not in text:
              raise SystemExit('probe import marker not found')
          text = text.replace(marker, marker + helper, 1)
          needle = 'shutil.copytree(discovery_root, args.output_root / "discovery")'
          if text.count(needle) != 2:
              raise SystemExit(f'unexpected copytree call count: {text.count(needle)}')
          text = text.replace(needle, 'copytree_data_only(discovery_root, args.output_root / "discovery")')
          path.write_text(text)
          PY
          diff -u \
            reports/rootfs/opt/liminalqa/airbnb_readonly_discovered_dates_probe.py.before \
            reports/rootfs/opt/liminalqa/airbnb_readonly_discovered_dates_probe.py \
            > reports/probe-runtime-patch.diff || test $? = 1
          sha256sum \
            reports/rootfs/opt/liminalqa/airbnb_readonly_discovered_dates_probe.py.before \
            reports/rootfs/opt/liminalqa/airbnb_readonly_discovered_dates_probe.py \
            > reports/probe-runtime-patch-sha256.txt
          sudo rm reports/rootfs/opt/liminalqa/airbnb_readonly_discovered_dates_probe.py.before

          dev=reports/rootfs/dev
          sudo mkdir -p "$dev" "$dev/pts" "$dev/shm"
          for entry in null zero random urandom; do sudo rm -f "$dev/$entry"; done
          sudo mknod -m 666 "$dev/null" c 1 3
          sudo mknod -m 666 "$dev/zero" c 1 5
          sudo mknod -m 666 "$dev/random" c 1 8
          sudo mknod -m 666 "$dev/urandom" c 1 9
          sudo ln -sfn /proc/self/fd "$dev/fd"
          sudo ln -sfn /proc/self/fd/0 "$dev/stdin"
          sudo ln -sfn /proc/self/fd/1 "$dev/stdout"
          sudo ln -sfn /proc/self/fd/2 "$dev/stderr"

          cat > /tmp/dns-probe.py <<'PY'
          import json, socket, traceback
          from pathlib import Path
          result = {"addresses": [], "error": None, "resolv_conf": Path('/etc/resolv.conf').read_text(errors='replace')}
          try:
              result["addresses"] = sorted({r[4][0] for r in socket.getaddrinfo('www.airbnb.com', 443, type=socket.SOCK_STREAM)})
          except Exception as exc:
              result["error"] = {"type": type(exc).__name__, "message": str(exc), "traceback": traceback.format_exc()}
          Path('/evidence').mkdir(parents=True, exist_ok=True)
          Path('/evidence/dns.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2), flush=True)
          raise SystemExit(0 if result["addresses"] else 1)
          PY
          sudo cp /tmp/dns-probe.py reports/rootfs/opt/diagnostic/dns-probe.py

      - name: DNS baseline in matching Docker namespace
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE/reports/rootfs:/work/rootfs:rw" \
            ubuntu:24.04 chroot /work/rootfs /usr/bin/python /opt/diagnostic/dns-probe.py \
            2>&1 | tee reports/dns-baseline.log
          sudo cp reports/rootfs/evidence/dns.json reports/dns-baseline.json
          sudo rm -f reports/rootfs/evidence/dns.json

      - name: Build Garden harness
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/garden-image/Dockerfile <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libseccomp2 ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY gl /opt/garden/gl
          RUN chmod 0755 /opt/garden/gl
          ENTRYPOINT ["/opt/garden/gl"]
          DOCKERFILE
          docker build -t garden-live:${GITHUB_SHA} reports/garden-image

      - name: DNS inside Garden
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/dns-seed.yaml <<'YAML'
          apiVersion: v0
          kind: Seed
          meta: {name: garden-dns, id: garden-dns-001}
          rootfs: {path: /work/rootfs}
          entrypoint:
            cmd: [/usr/bin/python, /opt/diagnostic/dns-probe.py]
            env: [HOME=/tmp, PYTHONUNBUFFERED=1]
            cwd: /
          mounts:
            - {type: proc, target: /proc}
            - {type: tmpfs, target: /tmp}
            - {type: tmpfs, target: /dev/shm}
          security:
            hostname: garden-dns
            drop_caps: [NET_ADMIN, SYS_ADMIN]
            seccomp_profile: default
          user: {uid: 0, gid: 0, map_rootless: false}
          store: {kind: mem}
          YAML
          docker run --rm --privileged --pids-limit 128 \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE/reports/rootfs:/work/rootfs:rw" \
            -v "$GITHUB_WORKSPACE/reports/dns-seed.yaml:/work/seed.yaml:ro" \
            garden-live:${GITHUB_SHA} run -f /work/seed.yaml --store mem \
            2>&1 | tee reports/dns-garden.log
          sudo cp reports/rootfs/evidence/dns.json reports/dns-garden.json
          sudo rm -f reports/rootfs/evidence/dns.json

      - name: Run exact read-only Airbnb probe inside Garden
        shell: bash
        run: |
          set -uo pipefail
          cat > reports/live-seed.yaml <<YAML
          apiVersion: v0
          kind: Seed
          meta: {name: airbnb-garden-live, id: airbnb-garden-live-001}
          rootfs: {path: /work/rootfs}
          entrypoint:
            cmd: [/usr/bin/python, /opt/liminalqa/airbnb_readonly_discovered_dates_probe_v4.py, --listing-url, ${LISTING_URL}, --output-root, /evidence/ABNB-GARDEN-LIVE]
            env: [PYTHONPATH=/opt/liminalqa, HOME=/tmp, PLAYWRIGHT_BROWSERS_PATH=/opt/liminal-playwright, PYTHONUNBUFFERED=1, DEBUG=pw:browser]
            cwd: /opt/liminalqa
          mounts:
            - {type: proc, target: /proc}
            - {type: tmpfs, target: /tmp}
            - {type: tmpfs, target: /dev/shm}
          security:
            hostname: airbnb-garden
            drop_caps: [NET_ADMIN, SYS_ADMIN]
            seccomp_profile: default
          user: {uid: 0, gid: 0, map_rootless: false}
          store: {kind: mem}
          YAML
          name="airbnb-live-${GITHUB_RUN_ID}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          set +e
          timeout 900 docker run --name "$name" --privileged \
            --cpus 1.50 --memory 2g --pids-limit 512 \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE/reports/rootfs:/work/rootfs:rw" \
            -v "$GITHUB_WORKSPACE/reports/live-seed.yaml:/work/seed.yaml:ro" \
            garden-live:${GITHUB_SHA} run -f /work/seed.yaml --store mem \
            > reports/live.log 2>&1
          code=$?
          set -e
          echo "$code" > reports/live.exit
          docker inspect "$name" --format '{{json .HostConfig}}' > reports/docker-host-config.json
          docker rm -f "$name" >/dev/null
          tail -400 reports/live.log

      - name: Extract and normalize exact evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_dir=reports/rootfs/evidence/ABNB-GARDEN-LIVE
          if [ -d "$source_dir" ]; then
            mkdir -p reports/evidence/ABNB-GARDEN-LIVE
            sudo tar -C "$source_dir" -cf - . | tar -C reports/evidence/ABNB-GARDEN-LIVE -xf -
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports')
          baseline = json.loads((root/'dns-baseline.json').read_text())
          garden_dns = json.loads((root/'dns-garden.json').read_text())
          run_code = int((root/'live.exit').read_text())
          host = json.loads((root/'docker-host-config.json').read_text())
          records = []
          for line in (root/'live.log').read_text(errors='replace').splitlines():
              try:
                  item = json.loads(line)
              except Exception:
                  continue
              if isinstance(item, dict) and item.get('event'):
                  records.append(item)
          events = [item['event'] for item in records]
          required = ['RUN_CREATED','SEED_LOADED','NS_CREATED','MOUNT_DONE','CAPS_DROPPED','SECCOMP_ENABLED','PROCESS_START','PROCESS_EXIT']
          exit_zero = any(item.get('event') == 'PROCESS_EXIT' and item.get('code') == 0 for item in records)
          paths = list((root/'evidence').rglob('probe-result.json'))
          probe = json.loads(paths[0].read_text()) if len(paths) == 1 else None
          limits = {'nano_cpus': host.get('NanoCpus'), 'memory_bytes': host.get('Memory'), 'pids_limit': host.get('PidsLimit')}
          expected = {'nano_cpus': 1500000000, 'memory_bytes': 2147483648, 'pids_limit': 512}
          safe = bool(probe) and probe.get('confirmed_defect') is False and probe.get('payment_submitted') is False and probe.get('reservation_created') is False
          confirmed = bool(baseline['addresses']) and bool(garden_dns['addresses']) and run_code == 0 and all(event in events for event in required) and exit_zero and limits == expected and safe
          result = {
              'schema_version': 'garden-airbnb-liminalos-ltp-ci-v0.3',
              'garden_commit': '9c43a78082d8bf943dd8d11e741b9a0c7cc61f65',
              'probe_commit': 'c89aa1ae920e1254b668aebfdf0a8c04e3c2738e',
              'liminalos_commit': '4f181b6721a9902ffb578afa315105b77737574d',
              'ltp_commit': 'b1fcf43977a2de5cd21b84887d6dcdc1d451acd1',
              'probe_runtime_patch_recorded': (root/'probe-runtime-patch.diff').is_file(),
              'dns_baseline_addresses': baseline['addresses'],
              'dns_garden_addresses': garden_dns['addresses'],
              'garden_events': events,
              'garden_run_exit': run_code,
              'outer_limits': {'configured': limits, 'expected': expected, 'matches': limits == expected},
              'probe_present': probe is not None,
              'probe_summary': None if probe is None else {key: probe.get(key) for key in ['classifier_revision','outcomes','normalized_signatures','evidence_grade','confirmed_defect','payment_submitted','reservation_created','resolved_target']},
              'safe_readonly_probe': safe,
              'live_garden_probe_confirmed': confirmed,
              'authority': {
                  'mode': 'audit_only',
                  'ownership': False,
                  'approval': False,
                  'execution': False,
                  'delivery': False,
                  'external_submission': False,
                  'deployment': False,
                  'merge': False,
                  'product_verdict_override': False,
              },
          }
          (root/'result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Generate real LiminalOSAI evidence advisory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/result.json
          test -s reports/liminalos/runtime.log
          python3 vendor/LiminalOSAI/tools/liminal_evidence_advisor.py \
            --evidence reports/result.json \
            --runtime-log reports/liminalos/runtime.log \
            --output-dir reports/advisory \
            | tee reports/liminalos/advisor.stdout.json

      - name: Join authorization, observation, and response claims with LTP
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/result.json
          test -s reports/advisory/liminalos-advice.json
          cat > reports/ltp/airbnb-transition.integration.test.ts <<'TS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { describe, expect, it } from 'vitest';
          import {
            sha256Ref,
            verifyLifecycleIntegrity,
            wrapRecord,
          } from './verify';

          const workspace = process.env.GITHUB_WORKSPACE;
          if (!workspace) throw new Error('GITHUB_WORKSPACE is required');
          const outputDir = path.join(workspace, 'reports', 'ltp');
          const readJson = (relative: string) =>
            JSON.parse(fs.readFileSync(path.join(workspace, relative), 'utf8'));
          const writeJson = (name: string, value: unknown) =>
            fs.writeFileSync(path.join(outputDir, name), JSON.stringify(value, null, 2) + '\n');

          describe('Airbnb trustworthy transition', () => {
            it('verifies evidence-bound claims and rejects a fabricated defect claim', () => {
              const run = readJson('reports/result.json');
              const advisory = readJson('reports/advisory/liminalos-advice.json');
              const transitionId = `airbnb-garden-${process.env.GITHUB_RUN_ID}`;
              const subjectId = 'airbnb-listing-1418689551881927394';
              const actionIdentity = {
                kind: 'public_readonly_airbnb_currency_history_probe',
                listing_id: '1418689551881927394',
                prohibited: ['login', 'host_contact', 'payment', 'reservation', 'external_submission'],
              };
              const binding = {
                garden_commit: process.env.GARDEN_SHA,
                probe_commit: process.env.PROBE_SHA,
                liminalos_commit: process.env.LIMINALOS_SHA,
                ltp_commit: process.env.LTP_SHA,
                workflow_head: process.env.GITHUB_SHA,
                workflow_run_id: process.env.GITHUB_RUN_ID,
              };
              const actionDigest = sha256Ref(actionIdentity);
              const bindingDigest = sha256Ref(binding);
              const authorization = wrapRecord({
                transition_id: transitionId,
                subject_id: subjectId,
                action_identity_digest: actionDigest,
                binding_digest: bindingDigest,
                decision: 'ALLOW',
                current_state: 'ACTIVE',
                scope: actionIdentity,
                authority: {
                  external_submission: false,
                  deployment: false,
                  merge: false,
                },
              });
              const joinedResult = {
                run,
                advisory,
                workflow: binding,
              };
              const observation = wrapRecord({
                transition_id: transitionId,
                subject_id: subjectId,
                authorization_ref: authorization.record_ref,
                action_identity_digest: actionDigest,
                binding_digest: bindingDigest,
                execution_status: 'EXECUTED',
                result: joinedResult,
                result_digest: sha256Ref(joinedResult),
              });

              const responseText = [
                'Garden completed the exact public read-only Airbnb probe.',
                'Both TRY to EUR to TRY to EUR attempts were consistent.',
                'No confirmed Airbnb product defect was observed.',
                'No payment or reservation was performed.',
                'LiminalOSAI ingested the evidence but cannot override the product verdict.',
              ].join('\n');

              const observationRefs = [observation.record_ref];
              const verified = verifyLifecycleIntegrity({
                transition_id: transitionId,
                subject_id: subjectId,
                response_text: responseText,
                authorization_record: authorization,
                observation_records: [observation],
                verifier: { id: 'ltp-airbnb-integrity', version: '0.1' },
                claims: [
                  {
                    claim_id: 'garden-executed',
                    claim_text: 'Garden completed the exact probe.',
                    observation_refs: observationRefs,
                    comparison: { kind: 'EXECUTION_STATUS_EQUALS', expected_status: 'EXECUTED' },
                  },
                  {
                    claim_id: 'live-probe-confirmed',
                    claim_text: 'The complete live Garden lifecycle was observed.',
                    observation_refs: observationRefs,
                    comparison: { kind: 'JSON_POINTER_EQUALS', pointer: '/run/live_garden_probe_confirmed', expected_value: true },
                  },
                  {
                    claim_id: 'currency-history-consistent',
                    claim_text: 'Both currency and history attempts were consistent.',
                    observation_refs: observationRefs,
                    comparison: { kind: 'JSON_POINTER_EQUALS', pointer: '/run/probe_summary/outcomes', expected_value: ['consistent', 'consistent'] },
                  },
                  {
                    claim_id: 'no-confirmed-defect',
                    claim_text: 'No confirmed Airbnb defect was observed.',
                    observation_refs: observationRefs,
                    comparison: { kind: 'JSON_POINTER_EQUALS', pointer: '/run/probe_summary/confirmed_defect', expected_value: false },
                  },
                  {
                    claim_id: 'no-payment',
                    claim_text: 'No payment was submitted.',
                    observation_refs: observationRefs,
                    comparison: { kind: 'JSON_POINTER_EQUALS', pointer: '/run/probe_summary/payment_submitted', expected_value: false },
                  },
                  {
                    claim_id: 'no-reservation',
                    claim_text: 'No reservation was created.',
                    observation_refs: observationRefs,
                    comparison: { kind: 'JSON_POINTER_EQUALS', pointer: '/run/probe_summary/reservation_created', expected_value: false },
                  },
                  {
                    claim_id: 'liminalos-ingested',
                    claim_text: 'LiminalOSAI ingested the evidence.',
                    observation_refs: observationRefs,
                    comparison: { kind: 'JSON_POINTER_EQUALS', pointer: '/advisory/evidence_ingested', expected_value: true },
                  },
                  {
                    claim_id: 'liminalos-no-override',
                    claim_text: 'LiminalOSAI cannot override the evidence-bound verdict.',
                    observation_refs: observationRefs,
                    comparison: { kind: 'JSON_POINTER_EQUALS', pointer: '/advisory/authority/product_verdict_override', expected_value: false },
                  },
                ],
              });

              const fabricated = verifyLifecycleIntegrity({
                transition_id: transitionId,
                subject_id: subjectId,
                response_text: 'A confirmed Airbnb product defect was found.',
                authorization_record: authorization,
                observation_records: [observation],
                verifier: { id: 'ltp-airbnb-negative-control', version: '0.1' },
                claims: [
                  {
                    claim_id: 'fabricated-confirmed-defect',
                    claim_text: 'A confirmed Airbnb product defect was found.',
                    observation_refs: observationRefs,
                    comparison: { kind: 'JSON_POINTER_EQUALS', pointer: '/run/probe_summary/confirmed_defect', expected_value: true },
                    text_heuristic: { pattern: 'confirmed Airbnb product defect was found', flags: 'i' },
                  },
                ],
              });

              expect(verified.response_integrity_record.overall_verdict).toBe('VERIFIED');
              expect(verified.dimensions.authority).toBe('VALID');
              expect(verified.dimensions.execution).toBe('OBSERVED_EXECUTED');
              expect(verified.verification_level).toBe('FULL_LIFECYCLE_JOINED');
              expect(verified.response_integrity_record.claims.every((claim) => claim.verdict === 'SUPPORTED')).toBe(true);
              expect(fabricated.response_integrity_record.overall_verdict).toBe('FAILED');
              expect(fabricated.response_integrity_record.claims[0].verdict).toBe('CONTRADICTED');
              expect(fabricated.response_integrity_record.claims[0].heuristic_result).toBe('MATCH');

              writeJson('authorization-record.json', authorization);
              writeJson('observation-record.json', observation);
              writeJson('ltp-response-integrity.json', verified);
              writeJson('ltp-negative-control.json', fabricated);
              writeJson('ltp-transition-packet.json', {
                schema_version: 'airbnb-ltp-transition-v0.1',
                ltp_commit: process.env.LTP_SHA,
                transition_id: transitionId,
                subject_id: subjectId,
                authorization_ref: authorization.record_ref,
                observation_ref: observation.record_ref,
                verified_response: verified,
                fabricated_claim_control: fabricated,
              });
            });
          });
          TS
          cp reports/ltp/airbnb-transition.integration.test.ts \
            vendor/LTP/tools/lifecycle-integrity/airbnb-transition.integration.test.ts
          cd vendor/LTP
          pnpm exec vitest run tools/lifecycle-integrity/airbnb-transition.integration.test.ts \
            2>&1 | tee "$GITHUB_WORKSPACE/reports/ltp/integration.log"
          rm tools/lifecycle-integrity/airbnb-transition.integration.test.ts

      - name: Validate deterministic, advisory, and LTP boundaries
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .live_garden_probe_confirmed == true and
            .safe_readonly_probe == true and
            .probe_summary.confirmed_defect == false and
            .authority.execution == false and
            .authority.external_submission == false and
            .authority.merge == false and
            .authority.product_verdict_override == false
          ' reports/result.json >/dev/null
          jq -e '
            .adapter_kind == "deterministic_evidence_advisor" and
            .evidence_ingested == true and
            .runtime_trace_ingested == true and
            .liminal_runtime.pipeline_complete == true and
            .classification == "NO_DEFECT_OBSERVED" and
            .product_verdict_source == "normalized_evidence_not_liminalos" and
            .authority.execution == false and
            .authority.external_submission == false and
            .authority.merge == false and
            .authority.product_verdict_override == false
          ' reports/advisory/liminalos-advice.json >/dev/null
          jq -e '
            .response_integrity_record.overall_verdict == "VERIFIED" and
            .dimensions.authority == "VALID" and
            .dimensions.execution == "OBSERVED_EXECUTED" and
            .verification_level == "FULL_LIFECYCLE_JOINED" and
            ([.response_integrity_record.claims[].verdict] | all(. == "SUPPORTED"))
          ' reports/ltp/ltp-response-integrity.json >/dev/null
          jq -e '
            .response_integrity_record.overall_verdict == "FAILED" and
            .response_integrity_record.claims[0].verdict == "CONTRADICTED" and
            .response_integrity_record.claims[0].heuristic_result == "MATCH"
          ' reports/ltp/ltp-negative-control.json >/dev/null
          cat reports/advisory/liminalos-causal-graph.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "## LTP lifecycle integrity"
            echo
            echo "- Authority: VALID"
            echo "- Execution: OBSERVED_EXECUTED"
            echo "- Actual response: VERIFIED"
            echo "- Fabricated defect claim: CONTRADICTED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove rootfs and hash evidence
        if: always()
        shell: bash
        run: |
          sudo rm -rf reports/rootfs
          rm -f reports/rootfs.tar
          find reports -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS.txt

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-airbnb-liminalos-ltp-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
