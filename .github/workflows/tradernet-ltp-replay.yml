name: Tradernet Canonical LTP Replay

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact 40-character revision; defaults to the selected workflow ref
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tradernet-ltp-replay.yml
      - audits/tradernet/terminal-loading-public.json
      - scripts/tradernet_terminal_loading_observer.mjs
      - scripts/tradernet_terminal_image_visibility_probe.mjs
      - scripts/write_exact_head_manifest.py
      - scripts/write_ltp_audit_trace.py
      - scripts/run_ltp_offline_replay.sh
      - tests/test_write_exact_head_manifest.py
      - tests/test_write_ltp_audit_trace.py

permissions:
  contents: read

concurrency:
  group: tradernet-ltp-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: LTP replay Â· ${{ matrix.audit_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - audit_id: public-terminal-loading
            audit_name: Tradernet public terminal loading audit
            evidence_dir_name: tradernet-ltp-public-terminal-loading
            artifact_prefix: tradernet-ltp-public-terminal-loading
          - audit_id: mobile-image-visibility
            audit_name: Tradernet terminal mobile image visibility
            evidence_dir_name: tradernet-ltp-mobile-image-visibility
            artifact_prefix: tradernet-ltp-mobile-image-visibility
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
      LTP_INSPECTOR_SHA: 5474f29021adf1fd9257f7d8375fedc485d00352
      EVIDENCE_ARTIFACT_NAME: ${{ matrix.artifact_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
      RECEIPT_ARTIFACT_NAME: ${{ matrix.artifact_prefix }}-receipt-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout exact audited revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify initial exact head
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "EXPECTED_SHA must be a lowercase 40-character SHA" >&2
            exit 2
          fi
          initial_sha="$(git rev-parse HEAD)"
          test "${initial_sha}" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "initial_sha=${initial_sha}" >> "${GITHUB_OUTPUT}"
          echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Validate public-only boundary
        shell: bash
        run: |
          set -euo pipefail
          config="audits/tradernet/terminal-loading-public.json"
          python3 -m json.tool "${config}" >/dev/null
          jq -e '
            .target_url == "https://tradernet.ru/terminal" and
            .observation_ms <= 30000 and
            .boundaries.public_page_only == true and
            .boundaries.one_navigation_per_profile == true and
            .boundaries.authenticated_testing == false and
            .boundaries.direct_api_testing == false and
            .boundaries.portfolio_access == false and
            .boundaries.personal_data_access == false and
            .boundaries.financial_operations == false and
            .boundaries.order_entry == false and
            .boundaries.market_depth_subscription == false and
            .boundaries.form_submission == false and
            .boundaries.fuzzing == false and
            .boundaries.load_testing == false and
            .boundaries.active_security_testing == false
          ' "${config}" >/dev/null

      - name: Validate trace helpers and negative cases
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          for path in [
              "scripts/write_exact_head_manifest.py",
              "scripts/write_ltp_audit_trace.py",
          ]:
              ast.parse(Path(path).read_text(encoding="utf-8"))
          PY
          python3 -m unittest \
            tests/test_write_exact_head_manifest.py \
            tests/test_write_ltp_audit_trace.py -v
          bash -n scripts/run_ltp_offline_replay.sh
          test -z "$(find scripts tests -type d -name __pycache__ -print -quit)"

      - name: Install pinned browser driver outside the worktree
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="${RUNNER_TEMP}/tradernet-node-deps-${{ matrix.audit_id }}"
          rm -rf "${deps_dir}"
          test ! -e node_modules
          test ! -L node_modules
          npm install --prefix "${deps_dir}" --no-save --package-lock=false puppeteer-core@24.16.0
          ln -s "${deps_dir}/node_modules" node_modules

      - name: Locate Chrome and validate capture scripts
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/tradernet_terminal_loading_observer.mjs
          node --check scripts/tradernet_terminal_image_visibility_probe.mjs
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "${chrome}"
          "${chrome}" --version
          echo "chrome=${chrome}" >> "${GITHUB_OUTPUT}"

      - name: Capture bounded public evidence
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/${{ matrix.evidence_dir_name }}"
          rm -rf "${evidence_dir}"
          mkdir -p "${evidence_dir}"
          case "${{ matrix.audit_id }}" in
            public-terminal-loading)
              node scripts/tradernet_terminal_loading_observer.mjs \
                --config audits/tradernet/terminal-loading-public.json \
                --chrome "${{ steps.runtime.outputs.chrome }}" \
                --output-dir "${evidence_dir}"
              cat "${evidence_dir}/result/terminal-loading-summary.md" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            mobile-image-visibility)
              node scripts/tradernet_terminal_image_visibility_probe.mjs \
                --config audits/tradernet/terminal-loading-public.json \
                --chrome "${{ steps.runtime.outputs.chrome }}" \
                --output-dir "${evidence_dir}"
              cat "${evidence_dir}/terminal-image-visibility-summary.md" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              echo "unsupported audit matrix entry" >&2
              exit 2
              ;;
          esac

      - name: Prepare frozen LTP inspector and registry
        id: ltp_runtime
        if: always() && steps.capture.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [ -L node_modules ]; then
            rm node_modules
          fi
          ltp_dir="${RUNNER_TEMP}/ltp-inspector-${{ matrix.audit_id }}"
          rm -rf "${ltp_dir}"
          git init "${ltp_dir}"
          git -C "${ltp_dir}" remote add origin \
            https://github.com/safal207/L-THREAD-Liminal-Thread-Secure-Protocol-LTP-.git
          git -C "${ltp_dir}" fetch --depth=1 origin "${LTP_INSPECTOR_SHA}"
          git -C "${ltp_dir}" checkout --detach FETCH_HEAD
          test "$(git -C "${ltp_dir}" rev-parse HEAD)" = "${LTP_INSPECTOR_SHA}"
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          (
            cd "${ltp_dir}"
            pnpm install --frozen-lockfile --ignore-scripts
          )
          echo "ltp_dir=${ltp_dir}" >> "${GITHUB_OUTPUT}"

      - name: Build canonical LTP JSONL trace
        id: trace
        if: always() && steps.capture.outcome == 'success' && steps.ltp_runtime.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/${{ matrix.evidence_dir_name }}"
          python3 scripts/write_ltp_audit_trace.py build \
            --output-dir "${evidence_dir}" \
            --audit-name "${{ matrix.audit_name }}" \
            --target "https://tradernet.ru/terminal" \
            --repository "${GITHUB_REPOSITORY}" \
            --expected-sha "${EXPECTED_SHA}" \
            --initial-sha "${{ steps.identity.outputs.initial_sha }}" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --started-at "${{ steps.identity.outputs.started_at }}" \
            --capture-status "${{ steps.capture.outcome }}" \
            --artifact-name "${EVIDENCE_ARTIFACT_NAME}" \
            --ltp-sha "${LTP_INSPECTOR_SHA}" \
            --critical-actions-registry \
              "${{ steps.ltp_runtime.outputs.ltp_dir }}/docs/contracts/ltp-critical-actions.v0.1.json"

      - name: Run strict inspector and two offline replays
        id: ltp_audit
        if: always() && steps.trace.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/${{ matrix.evidence_dir_name }}"
          bash scripts/run_ltp_offline_replay.sh \
            "${evidence_dir}/ltp/trace.jsonl" \
            "${evidence_dir}" \
            "${{ steps.ltp_runtime.outputs.ltp_dir }}" \
            "${LTP_INSPECTOR_SHA}"

