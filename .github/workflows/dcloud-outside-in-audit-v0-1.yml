name: DCloud Outside-In Audit v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/dcloud-outside-in-audit-v0-1
    paths:
      - .github/workflows/dcloud-outside-in-audit-v0-1.yml
      - audits/dcloud/public-audit-v0.1/contract.json
      - scripts/dcloud_public_audit_probe.py
      - tests/test_dcloud_public_audit_probe.py
      - docs/audits/DCLOUD_OUTSIDE_IN_AUDIT_V0_1.md
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dcloud-outside-in-audit-v0-1.yml
      - audits/dcloud/public-audit-v0.1/contract.json
      - scripts/dcloud_public_audit_probe.py
      - tests/test_dcloud_public_audit_probe.py
      - docs/audits/DCLOUD_OUTSIDE_IN_AUDIT_V0_1.md

permissions:
  contents: read

concurrency:
  group: dcloud-outside-in-audit-v0-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate bounded tri-lens contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate syntax and contract
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m json.tool audits/dcloud/public-audit-v0.1/contract.json >/dev/null
          python3 -m py_compile scripts/dcloud_public_audit_probe.py
          python3 scripts/dcloud_public_audit_probe.py --validate-only

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_dcloud_public_audit_probe.py -v

  observe:
    name: Recheck allowlisted public content
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run passive sequential audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports/dcloud/public-audit-v0.1
          python3 scripts/dcloud_public_audit_probe.py \
            --contract audits/dcloud/public-audit-v0.1/contract.json \
            --output-dir reports/dcloud/public-audit-v0.1
          cat reports/dcloud/public-audit-v0.1/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify generated evidence shape
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == "liminalqa-tri-lens-public-audit-result-v1" and
            .target.canonical_origin == "https://dcloud.tech" and
            .boundaries.public_pages_only == true and
            .boundaries.authentication == false and
            .boundaries.form_submission == false and
            .boundaries.email_or_external_contact == false and
            .boundaries.active_security_testing == false and
            .boundaries.external_submission_authorized == false and
            .boundaries.merge_authorized == false and
            .target_count >= 1 and
            .finding_count >= 1
          ' reports/dcloud/public-audit-v0.1/result.json >/dev/null

      - name: Record exact attempt and integrity manifest
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          output="reports/dcloud/public-audit-v0.1"
          source_head_sha="${PR_HEAD_SHA:-${GITHUB_SHA}}"
          base_sha="${PR_BASE_SHA:-}"
          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg workflow_sha "${GITHUB_SHA}" \
            --arg source_head_sha "${source_head_sha}" \
            --arg base_sha "${base_sha}" \
            --arg event_name "${GITHUB_EVENT_NAME}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              run_id:$run_id,
              run_attempt:$run_attempt,
              workflow_sha:$workflow_sha,
              source_head_sha:$source_head_sha,
              base_sha:(if $base_sha == "" then null else $base_sha end),
              event_name:$event_name,
              tested_revision_kind:(if $workflow_sha == $source_head_sha then "source_head" else "pull_request_merge_ref" end),
              generated_at:$generated_at
            }' > "${output}/exact-attempt.json"
          (
            cd "${output}"
            find . -maxdepth 1 -type f ! -name 'ARTIFACT_SHA256SUMS.txt' -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum \
              > ARTIFACT_SHA256SUMS.txt
            sha256sum -c ARTIFACT_SHA256SUMS.txt
          )

      - name: Upload exact-attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcloud-outside-in-audit-v0-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/dcloud/public-audit-v0.1/
          if-no-files-found: error
          retention-days: 30
