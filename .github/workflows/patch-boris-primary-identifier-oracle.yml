name: Apply Boris Primary Identifier Oracle Fix

on:
  pull_request:
    branches:
      - agent/greg-boris-open-work-review-2026-07-20
    paths:
      - .github/workflows/patch-boris-primary-identifier-oracle.yml

permissions:
  contents: write

concurrency:
  group: patch-boris-primary-identifier-oracle
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/boris-primary-identifier-contract-v0-1
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact oracle patch and remove this workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/boris_primary_identifier_contract_evidence.py")
          text = path.read_text(encoding="utf-8")

          anchor = '''def normalize_path(value: str, workspace: str) -> str:\n'''
          helper = '''def identifier_recognizable(rendered: str, identifier: str, max_length: int) -> bool:\n    """Require full identity when it fits; otherwise preserve stable prefix and suffix."""\n    if identifier in rendered:\n        return True\n    if len(identifier) <= max_length:\n        return False\n    anchor_length = min(16, max(6, max_length // 8))\n    return identifier[:anchor_length] in rendered and identifier[-anchor_length:] in rendered\n\n\n'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit("normalize_path anchor not found")
              text = text.replace(anchor, helper + anchor, 1)

          old_core = '''identifier_visible = any(identifier in proposed for identifier in normalized[:multi_limit])'''
          new_core = '''identifier_visible = all(\n                        identifier_recognizable(proposed, identifier, max_length)\n                        for identifier in normalized[:multi_limit]\n                    )'''
          if old_core not in text and new_core not in text:
              raise SystemExit("core identifier oracle anchor not found")
          text = text.replace(old_core, new_core, 1)

          old_edge = '''"identifier_visible": any(value in proposed for value in normalized[:multi_limit]),'''
          new_edge = '''"identifier_visible": all(\n                        identifier_recognizable(proposed, value, max_length)\n                        for value in normalized[:multi_limit]\n                    ),'''
          if old_edge not in text and new_edge not in text:
              raise SystemExit("edge identifier oracle anchor not found")
          text = text.replace(old_edge, new_edge, 1)

          old_critical = '''any(value in proposed for value in normalized[:multi_limit])\n                        if outcome in {"blocked", "permission_denied"}'''
          new_critical = '''all(\n                            identifier_recognizable(proposed, value, max_length)\n                            for value in normalized[:multi_limit]\n                        )\n                        if outcome in {"blocked", "permission_denied"}'''
          if old_critical not in text and new_critical not in text:
              raise SystemExit("critical identifier oracle anchor not found")
          text = text.replace(old_critical, new_critical, 1)

          old_comments = '''"passed": len(comments) == issue.get("comments"), "detail": {"fetched": len(comments), "reported": issue.get("comments")}'''
          new_comments = '''"passed": len(comments) >= int(issue.get("comments") or 0), "detail": {"fetched": len(comments), "reported_at_initial_snapshot": issue.get("comments")}'''
          if old_comments not in text and new_comments not in text:
              raise SystemExit("comments completeness anchor not found")
          text = text.replace(old_comments, new_comments, 1)

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/patch-boris-primary-identifier-oracle.yml").unlink()
          PY
          python -m py_compile scripts/boris_primary_identifier_contract_evidence.py
          git diff --check
          git config user.name "LiminalQA Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: fix bounded primary identifier oracle"
          git push origin HEAD:agent/boris-primary-identifier-contract-v0-1
