name: Causal Deep-Audit Skills Contract

on:
  workflow_dispatch:
  push:
    branches:
      - agent/causal-deep-audit-skills-v0-1
    paths:
      - skills/**
      - schemas/causal-deep-audit-packet.schema.json
      - scripts/validate_audit_skills.py
      - tests/test_audit_skills_contract.py
      - tests/test_cyber_causal_audit_skills.py
      - audits/security/tradernet-repository-causal-review-v1.json
      - docs/audits/TRADERNET_REPOSITORY_CYBER_CAUSAL_REVIEW.md
      - .github/workflows/audit-skills-contract.yml
  pull_request:
    branches:
      - main
    paths:
      - skills/**
      - schemas/causal-deep-audit-packet.schema.json
      - scripts/validate_audit_skills.py
      - tests/test_audit_skills_contract.py
      - tests/test_cyber_causal_audit_skills.py
      - audits/security/tradernet-repository-causal-review-v1.json
      - docs/audits/TRADERNET_REPOSITORY_CYBER_CAUSAL_REVIEW.md
      - .github/workflows/audit-skills-contract.yml

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: causal-deep-audit-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-text:
    name: Skill text - ${{ matrix.skill }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        skill:
          - causal-deep-audit
          - evidence-capture
          - causal-adjudication
          - cyber-causal-audit
          - websocket-redis-lifecycle
          - exact-head-governance
          - replay-memory
          - product-impact
          - transition-next-action
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact head
        run: |
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Validate one skill
        env:
          SKILL_NAME: ${{ matrix.skill }}
        run: |
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              'validator', root / 'scripts/validate_audit_skills.py'
          )
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          name = os.environ['SKILL_NAME']
          path = module.SKILLS[name]
          errors = module.validate_skill_text(name, path.read_text(encoding='utf-8'))
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated {name}.')
          PY

  schema-and-routes:
    name: Schema and orchestrator routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Validate schema and routes
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              'validator', root / 'scripts/validate_audit_skills.py'
          )
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          errors = module.validate_schema(
              json.loads(module.SCHEMA.read_text(encoding='utf-8'))
          )
          orchestrator = module.SKILLS['causal-deep-audit'].read_text(encoding='utf-8')
          for dependency in module.SKILLS:
              if dependency != 'causal-deep-audit' and dependency not in orchestrator:
                  errors.append(f'orchestrator does not invoke dependency: {dependency}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('Validated schema and orchestrator routes.')
          PY

  external-sources:
    name: External skill source gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Validate pins, licenses and non-execution
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              'validator', root / 'scripts/validate_audit_skills.py'
          )
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          payload = json.loads(module.CYBER_SOURCES.read_text(encoding='utf-8'))
          errors = module.validate_cyber_sources(payload)
          if errors:
              raise SystemExit('\n'.join(errors))
          print('External skills are pinned, licensed and non-executable by default.')
          PY

  audit-claims:
    name: Audit claim and authority gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Validate claim levels and discriminators
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              'validator', root / 'scripts/validate_audit_skills.py'
          )
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          payload = json.loads(module.CYBER_AUDIT.read_text(encoding='utf-8'))
          errors = module.validate_cyber_audit(payload)
          if errors:
              raise SystemExit('\n'.join(errors))
          print('Audit claims, authority boundaries and next tests are fail-closed.')
          PY

  negative-tests:
    name: Negative test - ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_repository_contract_is_valid
          - test_wrong_skill_name_fails_closed
          - test_missing_uncertainty_state_is_rejected
          - test_schema_without_not_run_is_rejected
          - test_schema_cannot_expand_gate_authority
          - test_external_skill_execution_cannot_be_enabled_silently
          - test_mutable_external_source_pin_is_rejected
          - test_external_executable_dependency_is_rejected
          - test_security_finding_cannot_skip_competing_explanation
          - test_security_finding_cannot_claim_confirmation_from_static_review
          - test_credential_and_financial_boundaries_are_mandatory
          - test_skills_and_report_contain_no_embedded_secret_values
          - test_analog_repository_boundary_is_explicit
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Run one fail-closed regression
        run: python3 -m unittest tests.test_audit_skills_contract.AuditSkillContractTests.${{ matrix.test }} -v

  evidence:
    name: Exact-head evidence manifest
    needs:
      - skill-text
      - schema-and-routes
      - external-sources
      - audit-claims
      - negative-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact head and clean worktree
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Write manifest
        run: |
          mkdir -p "${RUNNER_TEMP}/cyber-skill-evidence"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          paths = [
              Path('.github/workflows/audit-skills-contract.yml'),
              Path('schemas/causal-deep-audit-packet.schema.json'),
              Path('scripts/validate_audit_skills.py'),
              Path('skills/README.md'),
              Path('skills/causal-deep-audit/SKILL.md'),
              Path('skills/evidence-capture/SKILL.md'),
              Path('skills/causal-adjudication/SKILL.md'),
              Path('skills/cyber-causal-audit/SKILL.md'),
              Path('skills/cyber-causal-audit/SPEC.md'),
              Path('skills/cyber-causal-audit/sources.json'),
              Path('skills/websocket-redis-lifecycle/SKILL.md'),
              Path('skills/exact-head-governance/SKILL.md'),
              Path('skills/replay-memory/SKILL.md'),
              Path('skills/product-impact/SKILL.md'),
              Path('skills/transition-next-action/SKILL.md'),
              Path('audits/security/tradernet-repository-causal-review-v1.json'),
              Path('docs/audits/TRADERNET_REPOSITORY_CYBER_CAUSAL_REVIEW.md'),
              Path('tests/test_audit_skills_contract.py'),
              Path('tests/test_cyber_causal_audit_skills.py'),
          ]
          files = []
          for path in paths:
              data = path.read_bytes()
              files.append({
                  'path': str(path),
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          payload = {
              'schema_version': '1.0',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'expected_sha': os.environ['EXPECTED_SHA'],
              'final_sha': os.environ['EXPECTED_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'authority': 'READ_ONLY_CONTRACT_VALIDATION',
              'external_skill_execution': False,
              'credential_use': False,
              'external_mutation': False,
              'files': files,
          }
          target = Path(os.environ['RUNNER_TEMP']) / 'cyber-skill-evidence' / 'manifest.json'
          target.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: causal-deep-audit-skills-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cyber-skill-evidence/manifest.json
          if-no-files-found: error
          retention-days: 30
