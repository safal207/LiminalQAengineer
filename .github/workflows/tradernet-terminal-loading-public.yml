name: Tradernet Public Terminal Loading Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/tradernet-terminal-loading-audit
    paths:
      - .github/workflows/tradernet-terminal-loading-public.yml
      - audits/tradernet/terminal-loading-public.json
      - scripts/tradernet_terminal_loading_observer.mjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tradernet-terminal-loading-public.yml
      - audits/tradernet/terminal-loading-public.json
      - scripts/tradernet_terminal_loading_observer.mjs

permissions:
  contents: read

concurrency:
  group: tradernet-public-terminal-loading-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Passive desktop and mobile terminal loading observation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate exact safety boundary
        shell: bash
        run: |
          set -euo pipefail
          config="audits/tradernet/terminal-loading-public.json"
          python3 -m json.tool "${config}" >/dev/null
          jq -e '
            .target_url == "https://tradernet.ru/terminal" and
            .observation_ms <= 30000 and
            (.profiles | length) == 2 and
            .boundaries.public_page_only == true and
            .boundaries.one_navigation_per_profile == true and
            .boundaries.authenticated_testing == false and
            .boundaries.direct_api_testing == false and
            .boundaries.portfolio_access == false and
            .boundaries.personal_data_access == false and
            .boundaries.financial_operations == false and
            .boundaries.order_entry == false and
            .boundaries.market_depth_subscription == false and
            .boundaries.form_submission == false and
            .boundaries.fuzzing == false and
            .boundaries.load_testing == false and
            .boundaries.active_security_testing == false
          ' "${config}" >/dev/null

      - name: Install pinned browser driver
        run: npm install --no-save --package-lock=false puppeteer-core@24.16.0

      - name: Validate observer and locate Chrome
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check scripts/tradernet_terminal_loading_observer.mjs
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "${chrome}"
          "${chrome}" --version
          echo "chrome=${chrome}" >> "${GITHUB_OUTPUT}"

      - name: Observe public terminal loading
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports/tradernet-terminal-loading
          node scripts/tradernet_terminal_loading_observer.mjs \
            --config audits/tradernet/terminal-loading-public.json \
            --chrome "${{ steps.runtime.outputs.chrome }}" \
            --output-dir reports/tradernet-terminal-loading
          cat reports/tradernet-terminal-loading/result/terminal-loading-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradernet-public-terminal-loading-${{ github.run_id }}
          path: reports/tradernet-terminal-loading/
          if-no-files-found: error
          retention-days: 14
