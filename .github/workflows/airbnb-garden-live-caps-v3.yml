name: Airbnb Garden Live Caps v3

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/airbnb-garden-live-caps-v3.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airbnb-garden-live-caps-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  GARDEN_SHA: 9c43a78082d8bf943dd8d11e741b9a0c7cc61f65
  PROBE_SHA: c89aa1ae920e1254b668aebfdf0a8c04e3c2738e
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright/python:v1.60.0-noble
  LISTING_URL: https://www.airbnb.com/rooms/1418689551881927394

jobs:
  live:
    name: Exact Airbnb probe with enforced caps and seccomp
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Garden
        uses: actions/checkout@v4
        with:
          repository: safal207/GardenLiminal
          ref: ${{ env.GARDEN_SHA }}
          path: vendor/GardenLiminal
          persist-credentials: false

      - name: Checkout exact Airbnb probe
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.PROBE_SHA }}
          path: vendor/airbnb-probe
          persist-credentials: false

      - name: Verify exact sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/GardenLiminal rev-parse HEAD)" = "$GARDEN_SHA"
          test "$(git -C vendor/airbnb-probe rev-parse HEAD)" = "$PROBE_SHA"
          test -f vendor/airbnb-probe/scripts/airbnb_readonly_probe.py
          test -f vendor/airbnb-probe/scripts/airbnb_readonly_probe_guard.py
          test -f vendor/airbnb-probe/scripts/airbnb_readonly_discovered_dates_probe.py
          test -f vendor/airbnb-probe/scripts/airbnb_readonly_discovered_dates_probe_v4.py
          mkdir -p reports/caps-v3/{rootfs,garden-image,probe-image,evidence}
          sudo apt-get update -qq
          sudo apt-get install -y -qq libseccomp-dev pkg-config

      - name: Build and test exact Garden
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/GardenLiminal-caps-v3"
          cp -a vendor/GardenLiminal "$build_root"
          cd "$build_root"
          cargo build --release 2>&1 | tee "$GITHUB_WORKSPACE/reports/caps-v3/cargo-build.log"
          cargo test 2>&1 | tee "$GITHUB_WORKSPACE/reports/caps-v3/cargo-test.log"
          cp target/release/gl "$GITHUB_WORKSPACE/reports/caps-v3/garden-image/gl"

      - name: Build exact browser rootfs with minimal devices
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PLAYWRIGHT_IMAGE"
          docker image inspect "$PLAYWRIGHT_IMAGE" --format '{{json .RepoDigests}}' \
            > reports/caps-v3/playwright-image-digests.json
          cat > reports/caps-v3/probe-image/Dockerfile <<DOCKERFILE
          FROM ${PLAYWRIGHT_IMAGE}
          RUN python -m pip install --no-cache-dir playwright==1.60.0 \
              && python -c 'import encodings, playwright; print("python-runtime-ok")'
          RUN mkdir -p /opt/liminal-playwright \
              && cp -a /ms-playwright/. /opt/liminal-playwright/
          DOCKERFILE
          docker build -t airbnb-caps-v3-rootfs:${GITHUB_SHA} \
            reports/caps-v3/probe-image \
            2>&1 | tee reports/caps-v3/probe-image-build.log
          id="$(docker create airbnb-caps-v3-rootfs:${GITHUB_SHA} /bin/true)"
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          docker export "$id" -o reports/caps-v3/rootfs.tar
          sudo tar -xf reports/caps-v3/rootfs.tar -C reports/caps-v3/rootfs

          sudo mkdir -p reports/caps-v3/rootfs/opt/liminalqa reports/caps-v3/rootfs/evidence
          sudo cp \
            vendor/airbnb-probe/scripts/airbnb_readonly_probe.py \
            vendor/airbnb-probe/scripts/airbnb_readonly_probe_guard.py \
            vendor/airbnb-probe/scripts/airbnb_readonly_discovered_dates_probe.py \
            vendor/airbnb-probe/scripts/airbnb_readonly_discovered_dates_probe_v4.py \
            reports/caps-v3/rootfs/opt/liminalqa/
          sudo chmod -R a+rX reports/caps-v3/rootfs/opt/liminalqa

          dev=reports/caps-v3/rootfs/dev
          sudo mkdir -p "$dev" "$dev/pts" "$dev/shm"
          for entry in null zero random urandom; do sudo rm -f "$dev/$entry"; done
          sudo mknod -m 666 "$dev/null" c 1 3
          sudo mknod -m 666 "$dev/zero" c 1 5
          sudo mknod -m 666 "$dev/random" c 1 8
          sudo mknod -m 666 "$dev/urandom" c 1 9
          sudo ln -sfn /proc/self/fd "$dev/fd"
          sudo ln -sfn /proc/self/fd/0 "$dev/stdin"
          sudo ln -sfn /proc/self/fd/1 "$dev/stdout"
          sudo ln -sfn /proc/self/fd/2 "$dev/stderr"
          find "$dev" -maxdepth 1 -ls > reports/caps-v3/minimal-dev.txt

          browser="$(find reports/caps-v3/rootfs/opt/liminal-playwright \
            -type f -name chrome-headless-shell -perm -111 -print -quit)"
          node="$(find reports/caps-v3/rootfs/usr/local/lib \
            -type f -path '*/playwright/driver/node' -perm -111 -print -quit)"
          test -n "$browser"
          test -n "$node"
          printf '/%s\n' "${browser#reports/caps-v3/rootfs/}" > reports/caps-v3/browser-path.txt
          printf '/%s\n' "${node#reports/caps-v3/rootfs/}" > reports/caps-v3/node-path.txt

          printf 'nameserver 127.0.0.11\noptions ndots:0\n' \
            | sudo tee reports/caps-v3/rootfs/etc/resolv.conf >/dev/null

          set +e
          timeout 30 sudo chroot reports/caps-v3/rootfs \
            "$(cat reports/caps-v3/browser-path.txt)" --version \
            > reports/caps-v3/browser-preflight.log 2>&1
          code=$?
          set -e
          echo "$code" > reports/caps-v3/browser-preflight.exit
          test "$code" = 0

      - name: Build Garden harness and Seed
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/caps-v3/garden-image/Dockerfile <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                   libseccomp2 ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          COPY gl /opt/garden/gl
          RUN chmod 0755 /opt/garden/gl
          ENTRYPOINT ["/opt/garden/gl"]
          DOCKERFILE
          docker build -t garden-caps-v3:${GITHUB_SHA} \
            reports/caps-v3/garden-image \
            2>&1 | tee reports/caps-v3/garden-image-build.log

          cat > reports/caps-v3/seed.yaml <<YAML
          apiVersion: v0
          kind: Seed
          meta:
            name: airbnb-caps-v3-live
            id: airbnb-caps-v3-live-001
          rootfs:
            path: /work/rootfs
          entrypoint:
            cmd:
              - /usr/bin/python
              - /opt/liminalqa/airbnb_readonly_discovered_dates_probe_v4.py
              - --listing-url
              - ${LISTING_URL}
              - --output-root
              - /evidence/ABNB-GARDEN-CAPS-V3
            env:
              - PYTHONPATH=/opt/liminalqa
              - HOME=/tmp
              - PLAYWRIGHT_BROWSERS_PATH=/opt/liminal-playwright
              - PYTHONUNBUFFERED=1
              - DEBUG=pw:browser
            cwd: /opt/liminalqa
          mounts:
            - type: proc
              target: /proc
            - type: tmpfs
              target: /tmp
            - type: tmpfs
              target: /dev/shm
          security:
            hostname: airbnb-garden
            drop_caps: ["NET_ADMIN", "SYS_ADMIN"]
            seccomp_profile: default
          user:
            uid: 0
            gid: 0
            map_rootless: false
          store:
            kind: mem
          YAML

          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/reports/caps-v3/seed.yaml:/work/seed.yaml:ro" \
            garden-caps-v3:${GITHUB_SHA} inspect -f /work/seed.yaml \
            2>&1 | tee reports/caps-v3/inspect.log

      - name: Execute bounded live probe
        shell: bash
        run: |
          set -uo pipefail
          name="airbnb-caps-v3-${GITHUB_RUN_ID}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          set +e
          timeout 900 docker run \
            --name "$name" \
            --privileged \
            --cpus 1.50 \
            --memory 2g \
            --pids-limit 512 \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE/reports/caps-v3/rootfs:/work/rootfs:rw" \
            -v "$GITHUB_WORKSPACE/reports/caps-v3/seed.yaml:/work/seed.yaml:ro" \
            garden-caps-v3:${GITHUB_SHA} \
            run -f /work/seed.yaml --store mem \
            > reports/caps-v3/run.log 2>&1
          code=$?
          set -e
          echo "$code" > reports/caps-v3/run.exit
          docker inspect "$name" --format '{{json .HostConfig}}' \
            > reports/caps-v3/docker-host-config.json
          docker rm -f "$name" >/dev/null
          tail -400 reports/caps-v3/run.log

      - name: Extract and classify exact evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_dir=reports/caps-v3/rootfs/evidence/ABNB-GARDEN-CAPS-V3
          if [ -d "$source_dir" ]; then
            sudo cp -a "$source_dir" reports/caps-v3/evidence/
            sudo chown -R "$(id -u):$(id -g)" reports/caps-v3/evidence
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/caps-v3')
          code = int((root / 'run.exit').read_text())
          host = json.loads((root / 'docker-host-config.json').read_text())
          records = []
          log = (root / 'run.log').read_text(errors='replace')
          for line in log.splitlines():
              try: item = json.loads(line)
              except Exception: continue
              if isinstance(item, dict) and item.get('event'): records.append(item)
          events = [item['event'] for item in records]
          required = ['RUN_CREATED','SEED_LOADED','NS_CREATED','MOUNT_DONE','CAPS_DROPPED','SECCOMP_ENABLED','PROCESS_START','PROCESS_EXIT']
          exit_zero = any(item.get('event') == 'PROCESS_EXIT' and item.get('code') == 0 for item in records)
          probe_paths = list((root / 'evidence').rglob('probe-result.json'))
          probe = json.loads(probe_paths[0].read_text()) if len(probe_paths) == 1 else None
          limits = {'nano_cpus':host.get('NanoCpus'),'memory_bytes':host.get('Memory'),'pids_limit':host.get('PidsLimit')}
          expected = {'nano_cpus':1500000000,'memory_bytes':2147483648,'pids_limit':512}
          safe = bool(probe) and probe.get('confirmed_defect') is False and probe.get('payment_submitted') is False and probe.get('reservation_created') is False
          confirmed = code == 0 and all(event in events for event in required) and exit_zero and limits == expected and safe
          result = {
              'schema_version':'airbnb-garden-live-caps-v3',
              'garden_commit':'9c43a78082d8bf943dd8d11e741b9a0c7cc61f65',
              'probe_commit':'c89aa1ae920e1254b668aebfdf0a8c04e3c2738e',
              'target':'https://www.airbnb.com/rooms/1418689551881927394',
              'real_capability_drop_required':True,
              'minimal_dev_provided':True,
              'garden_run_exit':code,
              'garden_events':events,
              'missing_events':[event for event in required if event not in events],
              'garden_process_exit_zero':exit_zero,
              'outer_limits':{'configured':limits,'expected':expected,'matches':limits == expected},
              'probe_present':probe is not None,
              'probe_summary':None if probe is None else {
                  'classifier_revision':probe.get('classifier_revision'),
                  'outcomes':probe.get('outcomes'),
                  'normalized_signatures':probe.get('normalized_signatures'),
                  'evidence_grade':probe.get('evidence_grade'),
                  'confirmed_defect':probe.get('confirmed_defect'),
                  'payment_submitted':probe.get('payment_submitted'),
                  'reservation_created':probe.get('reservation_created'),
                  'resolved_target':probe.get('resolved_target'),
                  'reload_outcome':(probe.get('reload_probe') or {}).get('outcome'),
              },
              'browser_stderr_lines':[line for line in log.splitlines() if '[pid=' in line or 'ERROR:' in line or 'FATAL:' in line],
              'safe_readonly_probe':safe,
              'live_garden_probe_confirmed':confirmed,
              'authority':{'mode':'audit_only','ownership':False,'approval':False,'external_submission':False,'deployment':False,'merge':False},
          }
          (root / 'result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2))
          if not confirmed: raise SystemExit(1)
          PY

      - name: Remove rootfs and hash evidence
        if: always()
        shell: bash
        run: |
          sudo rm -rf reports/caps-v3/rootfs
          rm -f reports/caps-v3/rootfs.tar
          find reports/caps-v3 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > reports/caps-v3/SHA256SUMS.txt

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airbnb-garden-live-caps-v3-${{ github.run_id }}
          path: reports/caps-v3/
          if-no-files-found: error
          retention-days: 14
