name: Airbnb Garden Live Python Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - agent/airbnb-garden-liminalos-comparison-v0-1
    paths:
      - .github/workflows/airbnb-garden-live-python-runtime.yml
  pull_request:
    branches:
      - agent/airbnb-currency-history-lotus-result-v0-1
    paths:
      - .github/workflows/airbnb-garden-live-python-runtime.yml

permissions:
  contents: read

concurrency:
  group: airbnb-garden-live-python-${{ github.ref }}
  cancel-in-progress: true

env:
  GARDEN_SHA: ed4cc030398fee4f1a0fa015a4bd7badc7e87c7c
  PROBE_SHA: c89aa1ae920e1254b668aebfdf0a8c04e3c2738e
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright/python:v1.60.0-noble
  LISTING_URL: https://www.airbnb.com/rooms/1418689551881927394

jobs:
  live:
    name: Garden isolated Airbnb probe with image Python
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Garden source
        uses: actions/checkout@v4
        with:
          repository: safal207/GardenLiminal
          ref: ${{ env.GARDEN_SHA }}
          path: vendor/GardenLiminal
          persist-credentials: false

      - name: Checkout exact Airbnb probe
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.PROBE_SHA }}
          path: vendor/airbnb-probe
          persist-credentials: false

      - name: Verify sources and prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/GardenLiminal rev-parse HEAD)" = "$GARDEN_SHA"
          test "$(git -C vendor/airbnb-probe rev-parse HEAD)" = "$PROBE_SHA"
          mkdir -p reports/garden-python/{rootfs,garden-image,probe-image,evidence}
          sudo apt-get update -qq
          sudo apt-get install -y -qq libseccomp-dev pkg-config

      - name: Build exact Garden binary
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/GardenLiminal-python"
          rm -rf "$root"
          cp -a vendor/GardenLiminal "$root"
          cd "$root"
          cargo build --release 2>&1 | tee "$GITHUB_WORKSPACE/reports/garden-python/cargo-build.log"
          cargo test 2>&1 | tee "$GITHUB_WORKSPACE/reports/garden-python/cargo-test.log"
          cp target/release/gl "$GITHUB_WORKSPACE/reports/garden-python/garden-image/gl"

      - name: Export pinned Playwright Python rootfs
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PLAYWRIGHT_IMAGE"
          docker image inspect "$PLAYWRIGHT_IMAGE" --format '{{json .RepoDigests}}' \
            > reports/garden-python/playwright-image-digests.json
          cat > reports/garden-python/probe-image/Dockerfile <<DOCKERFILE
          FROM ${PLAYWRIGHT_IMAGE}
          RUN python -m pip install --no-cache-dir playwright==1.60.0 \
              && command -v python \
              && python -c 'import encodings, playwright; print("python-runtime-ok")'
          DOCKERFILE
          docker build -t airbnb-python-rootfs:${GITHUB_SHA} \
            reports/garden-python/probe-image \
            2>&1 | tee reports/garden-python/probe-image-build.log
          id="$(docker create airbnb-python-rootfs:${GITHUB_SHA} /bin/true)"
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          docker export "$id" -o reports/garden-python/rootfs.tar
          sudo tar -xf reports/garden-python/rootfs.tar -C reports/garden-python/rootfs
          sudo mkdir -p reports/garden-python/rootfs/opt/liminalqa reports/garden-python/rootfs/evidence
          sudo cp vendor/airbnb-probe/scripts/airbnb_readonly*.py \
            reports/garden-python/rootfs/opt/liminalqa/
          sudo chmod -R a+rX reports/garden-python/rootfs/opt/liminalqa
          test -x reports/garden-python/rootfs/usr/bin/python
          stat -c '%F %a %n' reports/garden-python/rootfs/usr/bin/python \
            > reports/garden-python/exported-python-path.txt

      - name: Build Garden harness and exact Seed
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/garden-python/garden-image/Dockerfile <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libseccomp2 ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          COPY gl /opt/garden/gl
          RUN chmod 0755 /opt/garden/gl
          ENTRYPOINT ["/opt/garden/gl"]
          DOCKERFILE
          docker build -t garden-python-live:${GITHUB_SHA} \
            reports/garden-python/garden-image \
            2>&1 | tee reports/garden-python/garden-image-build.log
          cat > reports/garden-python/seed.yaml <<YAML
          apiVersion: v0
          kind: Seed
          meta:
            name: airbnb-playwright-python-runtime
            id: airbnb-playwright-python-runtime-001
          rootfs:
            path: /work/rootfs
          entrypoint:
            cmd:
              - /usr/bin/python
              - /opt/liminalqa/airbnb_readonly_discovered_dates_probe_v4.py
              - --listing-url
              - ${LISTING_URL}
              - --output-root
              - /evidence/ABNB-GARDEN-ANTALYA
            env:
              - PYTHONPATH=/opt/liminalqa
              - HOME=/tmp
              - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
              - PYTHONUNBUFFERED=1
            cwd: /opt/liminalqa
          mounts:
            - type: proc
              target: /proc
            - type: tmpfs
              target: /tmp
            - type: tmpfs
              target: /dev/shm
          security:
            hostname: airbnb-garden
            drop_caps: ["NET_ADMIN", "SYS_ADMIN"]
            seccomp_profile: default
          user:
            uid: 0
            gid: 0
            map_rootless: false
          store:
            kind: mem
          YAML
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/reports/garden-python/seed.yaml:/work/seed.yaml:ro" \
            garden-python-live:${GITHUB_SHA} inspect -f /work/seed.yaml \
            2>&1 | tee reports/garden-python/inspect.log

      - name: Execute bounded live probe
        shell: bash
        run: |
          set -uo pipefail
          name="garden-python-${GITHUB_RUN_ID}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          set +e
          timeout 900 docker run \
            --name "$name" \
            --privileged \
            --cpus 1.50 \
            --memory 2g \
            --pids-limit 512 \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE/reports/garden-python/rootfs:/work/rootfs:rw" \
            -v "$GITHUB_WORKSPACE/reports/garden-python/seed.yaml:/work/seed.yaml:ro" \
            garden-python-live:${GITHUB_SHA} run -f /work/seed.yaml --store mem \
            > reports/garden-python/run.log 2>&1
          code=$?
          set -e
          echo "$code" > reports/garden-python/run.exit
          docker inspect "$name" --format '{{json .HostConfig}}' \
            > reports/garden-python/docker-host-config.json
          docker rm -f "$name" >/dev/null
          tail -250 reports/garden-python/run.log

      - name: Extract and adjudicate infrastructure result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src=reports/garden-python/rootfs/evidence/ABNB-GARDEN-ANTALYA
          if [ -d "$src" ]; then
            sudo cp -a "$src" reports/garden-python/evidence/
            sudo chown -R "$(id -u):$(id -g)" reports/garden-python/evidence
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/garden-python')
          code = int((root / 'run.exit').read_text().strip())
          host = json.loads((root / 'docker-host-config.json').read_text())
          records = []
          for line in (root / 'run.log').read_text(errors='replace').splitlines():
              try: item = json.loads(line)
              except Exception: continue
              if isinstance(item, dict) and item.get('event'): records.append(item)
          events = [x['event'] for x in records]
          required = ['RUN_CREATED','SEED_LOADED','NS_CREATED','MOUNT_DONE','CAPS_DROPPED','SECCOMP_ENABLED','PROCESS_START','PROCESS_EXIT']
          probe_paths = list((root / 'evidence').rglob('probe-result.json'))
          probe = json.loads(probe_paths[0].read_text()) if len(probe_paths) == 1 else None
          limits = {'nano_cpus':host.get('NanoCpus'),'memory_bytes':host.get('Memory'),'pids_limit':host.get('PidsLimit')}
          expected = {'nano_cpus':1500000000,'memory_bytes':2147483648,'pids_limit':512}
          safe = bool(probe) and probe.get('confirmed_defect') is False and probe.get('payment_submitted') is False and probe.get('reservation_created') is False
          exit_zero = any(x.get('event') == 'PROCESS_EXIT' and x.get('code') == 0 for x in records)
          confirmed = code == 0 and all(x in events for x in required) and exit_zero and limits == expected and safe
          result = {
              'schema_version':'airbnb-garden-live-python-runtime-v0.1',
              'garden_commit':'ed4cc030398fee4f1a0fa015a4bd7badc7e87c7c',
              'probe_commit':'c89aa1ae920e1254b668aebfdf0a8c04e3c2738e',
              'docker_exit_code':code,
              'garden_events':events,
              'missing_events':[x for x in required if x not in events],
              'garden_process_exit_zero':exit_zero,
              'outer_limits':{'configured':limits,'expected':expected,'matches':limits == expected},
              'probe_present':probe is not None,
              'probe_summary':None if probe is None else {
                  'classifier_revision':probe.get('classifier_revision'),
                  'outcomes':probe.get('outcomes'),
                  'normalized_signatures':probe.get('normalized_signatures'),
                  'evidence_grade':probe.get('evidence_grade'),
                  'confirmed_defect':probe.get('confirmed_defect'),
                  'payment_submitted':probe.get('payment_submitted'),
                  'reservation_created':probe.get('reservation_created'),
                  'reload_outcome':(probe.get('reload_probe') or {}).get('outcome'),
              },
              'safe_readonly_probe':safe,
              'live_garden_probe_confirmed':confirmed,
              'authority':{'mode':'audit_only','external_submission':False,'merge':False},
          }
          (root / 'result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2))
          if not confirmed: raise SystemExit(1)
          PY

      - name: Remove disposable rootfs and hash artifacts
        if: always()
        shell: bash
        run: |
          sudo rm -rf reports/garden-python/rootfs
          rm -f reports/garden-python/rootfs.tar
          find reports/garden-python -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > reports/garden-python/SHA256SUMS.txt

      - name: Upload exact Garden live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airbnb-garden-live-python-${{ github.run_id }}
          path: reports/garden-python/
          if-no-files-found: error
          retention-days: 14
