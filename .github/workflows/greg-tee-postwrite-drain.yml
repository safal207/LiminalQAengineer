name: Greg Tee Post-Write Drain Evidence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/greg-tee-readiness-handshake-v0-1
    paths:
      - .github/workflows/greg-tee-postwrite-drain.yml
      - scripts/greg_tee_postwrite_drain_evidence.py
      - scripts/build_greg_tee_drain_stack.py
      - audits/reviews/greg-tee-postwrite-drain-config-v1.json

permissions:
  contents: read

concurrency:
  group: greg-tee-postwrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Post-write matrix — ${{ matrix.slug }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux
          - os: macos-latest
            slug: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate post-write runners
        run: |
          set -euo pipefail
          python -m py_compile scripts/greg_tee_readiness_handshake_evidence.py
          python -m py_compile scripts/greg_tee_postwrite_drain_evidence.py
          python -m json.tool audits/reviews/greg-tee-postwrite-drain-config-v1.json >/dev/null
      - name: Checkout and install exact tee-output
        run: |
          set -euo pipefail
          rm -rf upstream-tee-output
          git init upstream-tee-output
          git -C upstream-tee-output remote add origin https://github.com/gdb/tee-output.git
          git -C upstream-tee-output fetch --depth=1 origin c41f8ff383200320b746e953e92709ae1b505a71
          git -C upstream-tee-output checkout --detach FETCH_HEAD
          test "$(git -C upstream-tee-output rev-parse HEAD)" = "c41f8ff383200320b746e953e92709ae1b505a71"
          python -m pip install ./upstream-tee-output
          command -v tee
          command -v parent-lifetime
      - name: Run post-write drain matrix
        run: |
          set -euo pipefail
          rm -rf "reports/postwrite/${{ matrix.slug }}"
          python scripts/greg_tee_postwrite_drain_evidence.py \
            --upstream-sha c41f8ff383200320b746e953e92709ae1b505a71 \
            --output-dir "reports/postwrite/${{ matrix.slug }}" \
            --rounds 6 \
            --lines 64 \
            --ready-timeout 5 \
            --drain-timeout 5 \
            --timeout 25
          cat "reports/postwrite/${{ matrix.slug }}/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Bind exact attempt and checksums
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ROOT: reports/postwrite/${{ matrix.slug }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          (root / "exact-attempt.json").write_text(json.dumps({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "execution_sha": os.environ["GITHUB_SHA"],
              "head_sha": os.environ.get("PR_HEAD_SHA") or os.environ["GITHUB_SHA"],
              "runner_os": os.environ["RUNNER_OS"],
              "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }, indent=2, sort_keys=True) + "\n")
          lines = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS.txt":
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}")
          (root / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: greg-postwrite-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/postwrite/${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Post-write replay and causal gate
    needs: [platform]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/checkout@v6
        with:
          repository: safal207/T-Trace
          ref: 6a0755dbe8a89decd325298ec4563b9bb16adc62
          path: components/ttrace
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: safal207/DRP
          ref: 92e63d7d4eeb55f8eb61956da002dc8951bab1c6
          path: components/drp
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: greg-postwrite-*
          path: downloaded
      - name: Build post-write evidence packet
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_greg_tee_drain_stack.py
          rm -rf reports/postwrite-final
          python scripts/build_greg_tee_drain_stack.py \
            --input-root downloaded \
            --output-dir reports/postwrite-final \
            --inherited-readiness-run 29779674997
      - name: Validate generated T-Trace and DRP records
        run: |
          set -euo pipefail
          test "$(git -C components/ttrace rev-parse HEAD)" = "6a0755dbe8a89decd325298ec4563b9bb16adc62"
          test "$(git -C components/drp rev-parse HEAD)" = "92e63d7d4eeb55f8eb61956da002dc8951bab1c6"
          python components/ttrace/scripts/validate_ttrace.py reports/postwrite-final/ttrace/postwrite-drain.ttrace.jsonl
          python components/drp/tools/drp_validator.py reports/postwrite-final/drp/decisions.json --json
      - name: Enforce post-write claim boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("reports/postwrite-final/greg-postwrite-full-stack-result.json").read_text())
          assert not result["blocking_checks"], result["blocking_checks"]
          contract = result["notification_contract"]
          verdict = result["summary"]["verdict"]
          if contract["permitted"]:
              assert verdict == "READY_TO_NOTIFY_POSTWRITE_DRAIN_BARRIER_SUPPORTED_CAUSE_NOT_EXCLUSIVE"
              assert contract["may_claim_postwrite_drain_support"] is True
          assert contract["may_claim_drain_as_sole_cause"] is False
          assert contract["must_disclose_output_complete_is_observational"] is True
          summary = Path("reports/postwrite-final/SUMMARY.md").read_text()
          assert verdict in summary
          assert "not an internal acknowledgement" in summary
          PY
      - name: Bind exact attempt and checksums
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ROOT: reports/postwrite-final
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          (root / "exact-attempt.json").write_text(json.dumps({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "execution_sha": os.environ["GITHUB_SHA"],
              "head_sha": os.environ.get("PR_HEAD_SHA") or os.environ["GITHUB_SHA"],
              "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }, indent=2, sort_keys=True) + "\n")
          lines = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS.txt":
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}")
          (root / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n")
          PY
      - name: Publish summary
        run: cat reports/postwrite-final/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: greg-postwrite-full-stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/postwrite-final/
          if-no-files-found: error
          retention-days: 30
