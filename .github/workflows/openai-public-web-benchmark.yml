name: OpenAI Public Web Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - agent/openai-public-web-benchmark
    paths:
      - .github/workflows/openai-public-web-benchmark.yml
      - audits/lighthouse/openai/domains.json
      - audits/lighthouse/openai/lighthouserc.cjs
      - audits/lighthouse/openai/policy.json
      - scripts/lighthouse_to_liminalqa.py
      - scripts/lighthouse_portfolio_summary.py
  pull_request:
    branches:
      - agent/takeprofit-lighthouse-audit
      - main
    paths:
      - .github/workflows/openai-public-web-benchmark.yml
      - audits/lighthouse/openai/domains.json
      - audits/lighthouse/openai/lighthouserc.cjs
      - audits/lighthouse/openai/policy.json
      - scripts/lighthouse_to_liminalqa.py
      - scripts/lighthouse_portfolio_summary.py

permissions:
  contents: read

concurrency:
  group: openai-public-web-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Validate exact public target inventory
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6

      - name: Validate bounded inventory
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          inventory="audits/lighthouse/openai/domains.json"
          policy="audits/lighthouse/openai/policy.json"
          python3 -m json.tool "${inventory}" >/dev/null
          python3 -m json.tool "${policy}" >/dev/null

          count="$(jq '.targets | length' "${inventory}")"
          if [[ "${count}" -ne 7 ]]; then
            echo "OpenAI benchmark requires exactly 7 reviewed targets; got ${count}" >&2
            exit 1
          fi

          jq -e '
            .scope_kind == "passive_public_quality" and
            .max_parallel == 2 and
            .boundaries.one_navigation_per_target == true and
            .boundaries.public_pages_only == true and
            .boundaries.active_security_testing == false and
            .boundaries.authenticated_testing == false and
            .boundaries.api_testing == false and
            .boundaries.prompt_submission == false and
            .boundaries.agent_or_tool_execution == false and
            .boundaries.account_or_billing_actions == false and
            .boundaries.file_uploads == false and
            .boundaries.fuzzing == false and
            .boundaries.load_testing == false and
            .boundaries.vulnerability_claim == false and
            (([.targets[].url] | sort) == ([
              "https://openai.com/",
              "https://chatgpt.com/",
              "https://openai.com/codex/",
              "https://developers.openai.com/",
              "https://developers.openai.com/api/docs/quickstart",
              "https://help.openai.com/en-us",
              "https://status.openai.com/"
            ] | sort))
          ' "${inventory}" >/dev/null

          while IFS= read -r url; do
            python3 scripts/lighthouse_to_liminalqa.py validate-url \
              --policy "${policy}" \
              --url "${url}" >/dev/null
          done < <(jq -r '.targets[].url' "${inventory}")

          matrix="$(jq -c '{include: [.targets[] | {slug: .slug, url: .url}]}' "${inventory}")"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "Validated ${count} exact allowlisted OpenAI public targets."

  audit:
    name: Lighthouse · ${{ matrix.slug }}
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      LIGHTHOUSE_TARGET_URL: ${{ matrix.url }}

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6

      - name: Confirm exact inventory membership
        shell: bash
        run: |
          set -euo pipefail
          jq -e \
            --arg slug "${{ matrix.slug }}" \
            --arg url "${{ matrix.url }}" \
            '.targets[] | select(.slug == $slug and .url == $url)' \
            audits/lighthouse/openai/domains.json >/dev/null
          python3 scripts/lighthouse_to_liminalqa.py validate-url \
            --policy audits/lighthouse/openai/policy.json \
            --url "${{ matrix.url }}" >/dev/null

      - name: Record runtime versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          python3 --version
          python3 -m py_compile \
            scripts/lighthouse_to_liminalqa.py \
            scripts/lighthouse_portfolio_summary.py

      - name: Collect one passive Lighthouse navigation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lighthouseci reports/lighthouse reports/domain
          mkdir -p "reports/domain/${{ matrix.slug }}"
          npx --yes @lhci/cli@0.15.1 autorun \
            --config=audits/lighthouse/openai/lighthouserc.cjs

      - name: Build bounded decision packet
        shell: bash
        run: |
          set -euo pipefail
          output="reports/domain/${{ matrix.slug }}"
          python3 scripts/lighthouse_to_liminalqa.py report \
            --policy audits/lighthouse/openai/policy.json \
            --input-dir .lighthouseci \
            --output-dir "${output}"

          sed -i \
            's/LiminalQA · Tradernet public Lighthouse audit/LiminalQA · OpenAI public web benchmark/' \
            "${output}/summary.md"

          mkdir -p "${output}/raw-lhci"
          cp -R .lighthouseci/. "${output}/raw-lhci/"
          if [[ -d reports/lighthouse/raw ]]; then
            mkdir -p "${output}/raw-report"
            cp -R reports/lighthouse/raw/. "${output}/raw-report/"
          fi
          cat "${output}/summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload exact domain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-public-domain-${{ matrix.slug }}-${{ github.run_id }}
          path: reports/domain/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate OpenAI LiminalQA packet
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6

      - name: Download completed domain packets
        uses: actions/download-artifact@v4
        with:
          pattern: openai-public-domain-*-${{ github.run_id }}
          path: downloaded-domain-packets

      - name: Build portfolio summary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lighthouse_portfolio_summary.py \
            --input-dir downloaded-domain-packets \
            --output-dir reports/portfolio
          cat reports/portfolio/portfolio-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload portfolio evidence
        uses: actions/upload-artifact@v4
        with:
          name: openai-public-web-portfolio-${{ github.run_id }}
          path: reports/portfolio/
          if-no-files-found: error
          retention-days: 14
