name: DCloud Rendered Audit v0.2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/dcloud-outside-in-audit-v0-1
    paths:
      - .github/workflows/dcloud-rendered-audit-v0-2.yml
      - audits/browser/dcloud/public-rendered-matrix-v0.2.json
      - audits/dcloud/public-audit-v0.1/contract.json
      - scripts/dcloud_rendered_audit_probe.mjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dcloud-rendered-audit-v0-2.yml
      - audits/browser/dcloud/public-rendered-matrix-v0.2.json
      - audits/dcloud/public-audit-v0.1/contract.json
      - scripts/dcloud_rendered_audit_probe.mjs

permissions:
  contents: read

concurrency:
  group: dcloud-rendered-audit-v0-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Confirm DCloud public signals in desktop and mobile browsers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate bounded configuration
        shell: bash
        run: |
          set -euo pipefail
          config="audits/browser/dcloud/public-rendered-matrix-v0.2.json"
          contract="audits/dcloud/public-audit-v0.1/contract.json"
          python3 -m json.tool "${config}" >/dev/null
          python3 -m json.tool "${contract}" >/dev/null
          jq -e '
            .schema_version == "liminalqa-dcloud-public-rendered-v1" and
            (.profiles | length) == 2 and
            ([.profiles[].id] | sort) == ["desktop", "mobile"] and
            .boundaries.public_pages_only == true and
            .boundaries.natural_navigation_only == true and
            .boundaries.passive_browser_observation == true and
            .boundaries.keyboard_navigation_only == true and
            .boundaries.authentication == false and
            .boundaries.account_access == false and
            .boundaries.form_submission == false and
            .boundaries.button_clicks == false and
            .boundaries.direct_api_testing == false and
            .boundaries.email_or_external_contact == false and
            .boundaries.enumeration == false and
            .boundaries.fuzzing == false and
            .boundaries.load_testing == false and
            .boundaries.active_security_testing == false and
            .boundaries.server_state_change == false and
            .boundaries.external_submission_authorized == false and
            .boundaries.deployment_authorized == false and
            .boundaries.merge_authorized == false
          ' "${config}" >/dev/null
          jq -e '
            .target.canonical_origin == "https://dcloud.tech" and
            ([.targets[].url | startswith("https://dcloud.tech/")] | all) and
            .boundaries.external_submission_authorized == false and
            .boundaries.merge_authorized == false
          ' "${contract}" >/dev/null

      - name: Install pinned browser driver
        run: npm install --no-save --package-lock=false puppeteer-core@24.16.0

      - name: Validate runtime and locate Chrome
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check scripts/dcloud_rendered_audit_probe.mjs
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "${chrome}"
          "${chrome}" --version
          echo "chrome=${chrome}" >> "${GITHUB_OUTPUT}"

      - name: Run bounded rendered matrix
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          source_head_sha="${PR_HEAD_SHA:-${GITHUB_SHA}}"
          base_sha="${PR_BASE_SHA:-}"
          rm -rf reports/dcloud-rendered-v0-2
          SOURCE_HEAD_SHA="${source_head_sha}" BASE_SHA="${base_sha}" \
            node scripts/dcloud_rendered_audit_probe.mjs \
              --config audits/browser/dcloud/public-rendered-matrix-v0.2.json \
              --contract audits/dcloud/public-audit-v0.1/contract.json \
              --chrome "${{ steps.runtime.outputs.chrome }}" \
              --output-dir reports/dcloud-rendered-v0-2

          result="reports/dcloud-rendered-v0-2/dcloud-rendered-result.json"
          tmp="$(mktemp)"
          jq \
            --arg workflow_sha "${GITHUB_SHA}" \
            --arg source_head_sha "${source_head_sha}" \
            --arg base_sha "${base_sha}" \
            '.execution.workflow_sha = $workflow_sha |
             .execution.source_head_sha = $source_head_sha |
             .execution.base_sha = (if $base_sha == "" then null else $base_sha end) |
             .execution.tested_revision_kind = (if $workflow_sha == $source_head_sha then "source_head" else "pull_request_merge_ref" end)' \
            "${result}" > "${tmp}"
          mv "${tmp}" "${result}"

          python3 - "reports/dcloud-rendered-v0-2/dcloud-rendered-summary.md" "${source_head_sha}" "${GITHUB_SHA}" "${base_sha}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source_head, workflow_sha, base_sha = sys.argv[2:5]
          lines = path.read_text(encoding="utf-8").splitlines()
          output = []
          for line in lines:
              if line.startswith("**Exact head:**"):
                  output.append(f"**Source head:** `{source_head}`  ")
                  output.append(f"**Tested workflow SHA:** `{workflow_sha}`  ")
                  if base_sha:
                      output.append(f"**Base SHA:** `{base_sha}`")
              else:
                  output.append(line)
          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

          cat reports/dcloud-rendered-v0-2/dcloud-rendered-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate evidence and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          result="reports/dcloud-rendered-v0-2/dcloud-rendered-result.json"
          expected="$(jq '(.targets | length) * 2' audits/dcloud/public-audit-v0.1/contract.json)"
          jq -e \
            --argjson expected "${expected}" '
            .schema_version == "liminalqa-dcloud-public-rendered-result-v1" and
            (.observations | length) == $expected and
            .aggregate.expected_observation_count == $expected and
            .aggregate.observed_route_profile_count == $expected and
            (.execution.source_head_sha | type == "string" and length == 40) and
            (.execution.workflow_sha | type == "string" and length == 40) and
            (.execution.tested_revision_kind == "source_head" or .execution.tested_revision_kind == "pull_request_merge_ref") and
            .authority.mode == "evidence_only" and
            .authority.grants.ownership == false and
            .authority.grants.approval == false and
            .authority.grants.execution == false and
            .authority.grants.external_submission == false and
            .authority.grants.delivery == false and
            .authority.grants.deployment == false and
            .authority.grants.merge == false
          ' "${result}" >/dev/null
          ! grep -R -E -i 'authorization:|cookie:|set-cookie:|access_token|refresh_token|sessionid' \
            reports/dcloud-rendered-v0-2 \
            --exclude='*.png'

      - name: Record exact-attempt manifest
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          output="reports/dcloud-rendered-v0-2"
          source_head_sha="${PR_HEAD_SHA:-${GITHUB_SHA}}"
          base_sha="${PR_BASE_SHA:-}"
          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg workflow_sha "${GITHUB_SHA}" \
            --arg source_head_sha "${source_head_sha}" \
            --arg base_sha "${base_sha}" \
            --arg event_name "${GITHUB_EVENT_NAME}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              run_id:$run_id,
              run_attempt:$run_attempt,
              workflow_sha:$workflow_sha,
              source_head_sha:$source_head_sha,
              base_sha:(if $base_sha == "" then null else $base_sha end),
              event_name:$event_name,
              tested_revision_kind:(if $workflow_sha == $source_head_sha then "source_head" else "pull_request_merge_ref" end),
              generated_at:$generated_at
            }' > "${output}/exact-attempt.json"

          (
            cd "${output}"
            find . -maxdepth 1 -type f ! -name 'ARTIFACT_SHA256SUMS.txt' -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum \
              > ARTIFACT_SHA256SUMS.txt
            sha256sum -c ARTIFACT_SHA256SUMS.txt
          )

      - name: Upload exact rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcloud-rendered-audit-v0-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/dcloud-rendered-v0-2/
          if-no-files-found: error
          retention-days: 30
