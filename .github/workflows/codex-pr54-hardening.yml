name: Codex harden PR 54

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/codex-pr54-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: agent/tradernet-lighthouse-audit
          fetch-depth: 2

      - name: Recover and execute reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/codex-pr54-hardening.yml > /tmp/codex-pr54-parent.yml
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' /tmp/codex-pr54-parent.yml > /tmp/codex-pr54-patch.py
          test -s /tmp/codex-pr54-patch.py
          python3 /tmp/codex-pr54-patch.py

      - name: Validate patched sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/lighthouse_to_liminalqa.py \
            scripts/lighthouse_causality_graph.py \
            scripts/render_lighthouse_causality.py \
            scripts/tradernet_desktop_hero_result.py
          node --check scripts/tradernet_hero_preload_experiment_cdp.mjs
          python3 -m json.tool audits/lighthouse/tradernet/domains.json >/dev/null

      - name: Commit hardened review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git rm .github/workflows/codex-pr54-hardening.yml
          git add \
            .github/workflows/tradernet-domain-portfolio.yml \
            .github/workflows/tradernet-lighthouse.yml \
            .github/workflows/tradernet-hero-preload-counterfactual.yml \
            .github/workflows/tradernet-hero-preload-desktop-counterfactual.yml \
            scripts/lighthouse_to_liminalqa.py \
            scripts/tradernet_desktop_hero_result.py \
            scripts/tradernet_hero_preload_experiment_cdp.mjs \
            docs/audits/TRADERNET_LIGHTHOUSE.md
          git commit -m "fix: address Tradernet audit review blockers"
          git push origin HEAD:agent/tradernet-lighthouse-audit
