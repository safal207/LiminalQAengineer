name: Company Audit Bootstrap Diagnostic

on:
  push:
    branches:
      - agent/company-self-service-audit-v0-1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m json.tool audits/templates/company-public-audit.example.json >/dev/null
