name: Revolut Public Lotus Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/revolut-public-lotus-audit-v0-1
    paths:
      - .github/workflows/revolut-public-lotus.yml
      - standards/lotus-qa/lotus-qa-contract-v0.1.json
      - audits/lotus/revolut/revolut-public-evidence-v0.1.json
      - audits/lotus/revolut/revolut-findings-v0.1.json
      - scripts/lotus_qa_decision_packet.py
      - scripts/lotus_liminaldb_memory.py
      - tests/test_revolut_lotus_packet.py
      - docs/audits/REVOLUT_PUBLIC_LOTUS_AUDIT.md
  pull_request:
    branches:
      - agent/lotus-liminaldb-memory-v0-1
      - main
    paths:
      - .github/workflows/revolut-public-lotus.yml
      - standards/lotus-qa/lotus-qa-contract-v0.1.json
      - audits/lotus/revolut/revolut-public-evidence-v0.1.json
      - audits/lotus/revolut/revolut-findings-v0.1.json
      - scripts/lotus_qa_decision_packet.py
      - scripts/lotus_liminaldb_memory.py
      - tests/test_revolut_lotus_packet.py
      - docs/audits/REVOLUT_PUBLIC_LOTUS_AUDIT.md

permissions:
  contents: read

concurrency:
  group: revolut-public-lotus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Revolut Lotus findings and memory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6

      - name: Validate source material
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m json.tool audits/lotus/revolut/revolut-public-evidence-v0.1.json >/dev/null
          python3 -m json.tool audits/lotus/revolut/revolut-findings-v0.1.json >/dev/null
          python3 -m py_compile \
            scripts/lotus_qa_decision_packet.py \
            scripts/lotus_liminaldb_memory.py \
            tests/test_revolut_lotus_packet.py

      - name: Run Revolut Lotus regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_revolut_lotus_packet.py -v

      - name: Generate exact packet and LiminalDB memory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports/revolut
          python3 scripts/lotus_qa_decision_packet.py \
            --contract standards/lotus-qa/lotus-qa-contract-v0.1.json \
            --findings audits/lotus/revolut/revolut-findings-v0.1.json \
            --output-dir reports/revolut
          python3 scripts/lotus_liminaldb_memory.py export \
            --packet reports/revolut/lotus-decision-packet.json \
            --observed-at "$(git show -s --format=%cI HEAD)" \
            --source-commit "$(git rev-parse HEAD)" \
            --output reports/revolut/liminaldb-events.jsonl
          python3 scripts/lotus_liminaldb_memory.py compare \
            --events reports/revolut/liminaldb-events.jsonl \
            --output reports/revolut/liminaldb-transitions.json

      - name: Validate decisions, memory, and authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == "liminalqa-lotus-decision-packet-v0.1" and
            .summary.finding_count == 9 and
            .summary.pythia_verdicts.ALLOW == 7 and
            .summary.pythia_verdicts.BLOCK == 1 and
            .summary.pythia_verdicts.ESCALATE == 1 and
            .summary.decision_statuses.CONFIRMED == 7 and
            .summary.decision_statuses.BLOCKED == 1 and
            .summary.decision_statuses.NEEDS_EVIDENCE == 1 and
            .summary.user_control_risks.HIGH == 1 and
            .summary.user_control_risks.MEDIUM == 5 and
            .summary.user_control_risks.LOW == 1 and
            .summary.user_control_risks.NONE == 1 and
            .summary.user_control_risks.UNKNOWN == 1 and
            .summary.durable_memory_count == 0 and
            .authority.mode == "audit_only" and
            .authority.ownership == false and
            .authority.approval == false and
            .authority.execution == false and
            .authority.delivery == false and
            .authority.deployment == false and
            .authority.merge == false and
            (.findings[] | select(.finding_id == "RVLT-WEB-DEEPLINK-INTERMITTENT-001") | .decision.severity) == "UNASSIGNED" and
            (.findings[] | select(.finding_id == "RVLT-X-ASKS-DESCENDING-HYPOTHESIS-001") | .decision.status) == "BLOCKED"
          ' reports/revolut/lotus-decision-packet.json >/dev/null
          jq -s -e '
            length == 9 and
            ([.[].id] | unique | length) == 9 and
            ([.[].details.adapter.write_mode] | all(. == "artifact_only")) and
            ([.[].details.finding.durable_memory] | all(. == false)) and
            ([.[].details.authority.execution] | all(. == false)) and
            ([.[].details.authority.merge] | all(. == false))
          ' reports/revolut/liminaldb-events.jsonl >/dev/null
          jq -e '
            .schema_version == "liminaldb-lotus-compare-v0.1" and
            .event_count == 9 and
            .canonical_finding_count == 9 and
            .transition_count == 0
          ' reports/revolut/liminaldb-transitions.json >/dev/null
          sha256sum \
            audits/lotus/revolut/revolut-public-evidence-v0.1.json \
            reports/revolut/lotus-decision-packet.json \
            reports/revolut/liminaldb-events.jsonl \
            reports/revolut/liminaldb-transitions.json \
            > reports/revolut/SHA256SUMS.txt
          cat reports/revolut/lotus-decision-packet.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload exact Revolut Lotus artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revolut-public-lotus-${{ github.run_id }}
          path: reports/revolut/
          if-no-files-found: error
          retention-days: 14
