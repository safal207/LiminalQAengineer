# Self-dogfooding: ship LiminalQA's own test results to a LiminalQA instance.
#
# Only runs when LIMINALQA_URL secret is configured.  Designed to be a
# no-op / skipped in forks without the secret.
#
# Required secrets (optional — job is skipped when absent):
#   LIMINALQA_URL    — target LiminalQA instance
#   LIMINALQA_TOKEN  — bearer token

name: LiminalQA Self-Test Ingest

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  self-ingest:
    name: Ingest own test results
    runs-on: ubuntu-latest
    if: vars.LIMINALQA_URL != ''

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Run tests (nextest + JUnit output)
        run: |
          cargo nextest run --profile ci \
            --workspace \
            --exclude liminalqa-runner \
            2>&1 || true
        # nextest writes junit to target/nextest/ci/junit.xml

      - name: Start LiminalQA run
        id: start-run
        if: env.LIMINALQA_URL != ''
        env:
          LIMINALQA_URL: ${{ vars.LIMINALQA_URL }}
          LIMINALQA_TOKEN: ${{ secrets.LIMINALQA_TOKEN }}
        run: |
          RESP=$(curl -sf \
            -X POST "$LIMINALQA_URL/ingest/run" \
            -H "Authorization: Bearer $LIMINALQA_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "plan_name": "liminalqa-self",
              "env": {"CI": "true", "GITHUB_SHA": "${{ github.sha }}"},
              "runner_version": "self-v1"
            }' || echo '{"run_id":""}')
          echo "run_id=$(echo $RESP | python3 -c "import sys,json; print(json.load(sys.stdin).get('run_id',''))")" >> "$GITHUB_OUTPUT"

      - name: Ingest nextest JUnit results
        if: steps.start-run.outputs.run_id != ''
        env:
          LIMINALQA_URL: ${{ vars.LIMINALQA_URL }}
          LIMINALQA_TOKEN: ${{ secrets.LIMINALQA_TOKEN }}
          RUN_ID: ${{ steps.start-run.outputs.run_id }}
        run: |
          find target/nextest -name "*.xml" | head -5 | while read xml; do
            python3 - "$xml" "$RUN_ID" <<'PYEOF'
          import sys, json, xml.etree.ElementTree as ET, urllib.request, os
          xml_path, run_id = sys.argv[1], sys.argv[2]
          url, token = os.environ["LIMINALQA_URL"], os.environ["LIMINALQA_TOKEN"]
          tree = ET.parse(xml_path)
          tests = []
          for tc in tree.iter("testcase"):
              status = "pass"
              if tc.find("failure") is not None or tc.find("error") is not None:
                  status = "fail"
              elif tc.find("skipped") is not None:
                  status = "skip"
              tests.append({
                  "name": tc.get("name", "unknown"),
                  "suite": tc.get("classname", "unknown"),
                  "status": status,
                  "duration_ms": int(float(tc.get("time", "0")) * 1000),
                  "run_id": run_id,
              })
          if not tests:
              sys.exit(0)
          body = json.dumps({"run_id": run_id, "tests": tests}).encode()
          req = urllib.request.Request(
              f"{url}/ingest/batch", data=body,
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              method="POST")
          with urllib.request.urlopen(req) as r:
              print(f"Ingested {len(tests)} tests: HTTP {r.status}")
          PYEOF
          done

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-results
          path: target/nextest/ci/
          retention-days: 14
