name: Codex fix Lotus evidence boundaries

on:
  push:
    branches:
      - agent/lotus-evidence-vertical-slice
    paths:
      - .github/workflows/codex-fix-lotus-evidence.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lotus-evidence-vertical-slice
          fetch-depth: 0

      - name: Apply evidence hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          gate_path = "scripts/lotus_capture_gate.py"
          replace_once(
              gate_path,
              '''    if not isinstance(environment["authenticated"], bool):
              raise CaptureError("capture: environment.authenticated must be boolean")
          ''',
              '''    if not isinstance(environment["authenticated"], bool):
              raise CaptureError("capture: environment.authenticated must be boolean")
          if environment["authenticated"] is not False:
              raise CaptureError("capture: environment.authenticated must remain false")
          ''',
          )

          replace_once(
              gate_path,
              '''def inconsistency_fingerprint(attempt: dict[str, Any]) -> str:
              """Normalize an inconsistent attempt into a comparable transition class."""
              before = attempt["state_before"]
              after = attempt["state_after"]

              def normalize_total(value: str) -> str:
                  """Remove whitespace and case differences from a visible total."""
                  return re.sub(r"\\s+", "", value).casefold()

              value = {
                  "before_currency": before["display_currency"],
                  "after_currency": after["display_currency"],
                  "currency_changed": before["display_currency"] != after["display_currency"],
                  "total_relation": (
                      "unchanged"
                      if normalize_total(before["display_total"])
                      == normalize_total(after["display_total"])
                      else "changed"
                  ),
              }
              return json.dumps(value, sort_keys=True, separators=(",", ":"))
          ''',
              '''def inconsistency_fingerprint(attempt: dict[str, Any]) -> str | None:
              """Derive a comparable inconsistency class from visible state, not a declaration."""
              before = attempt["state_before"]
              after = attempt["state_after"]

              def normalize_total(value: str) -> str:
                  """Remove whitespace and case differences from a visible total."""
                  return re.sub(r"\\s+", "", value).casefold()

              currency_changed = before["display_currency"] != after["display_currency"]
              total_changed = (
                  normalize_total(before["display_total"])
                  != normalize_total(after["display_total"])
              )
              if currency_changed == total_changed:
                  return None

              value = {
                  "before_currency": before["display_currency"],
                  "after_currency": after["display_currency"],
                  "currency_changed": currency_changed,
                  "total_relation": "changed" if total_changed else "unchanged",
              }
              return json.dumps(value, sort_keys=True, separators=(",", ":"))
          ''',
          )

          replace_once(
              gate_path,
              '''    attempt_ids: set[str] = set()
              context_ids: set[str] = set()
              inconsistent_fingerprints: list[str] = []
              for attempt in attempts:
          ''',
              '''    attempt_ids: set[str] = set()
              context_ids: set[str] = set()
              seen_attempt_artifact_paths: set[str] = set()
              inconsistent_fingerprints: list[str] = []
              for attempt in attempts:
          ''',
          )

          replace_once(
              gate_path,
              '''        result = attempt.get("result")
              if result not in {"consistent", "inconsistent", "inconclusive"}:
                  raise CaptureError(f"attempt {attempt_id}: invalid result")
              before, before_ts = validate_state(
          ''',
              '''        result = attempt.get("result")
              if result not in {"consistent", "inconsistent", "inconclusive"}:
                  raise CaptureError(f"attempt {attempt_id}: invalid result")
              attempt_artifacts = attempt.get("artifacts")
              if not isinstance(attempt_artifacts, list):
                  raise CaptureError(f"attempt {attempt_id}: artifacts must be a list")
              attempt_roles = [artifact.get("role") for artifact in attempt_artifacts]
              if (
                  set(attempt_roles) != REQUIRED_ARTIFACT_ROLES
                  or len(attempt_roles) != len(REQUIRED_ARTIFACT_ROLES)
              ):
                  raise CaptureError(
                      f"attempt {attempt_id}: exactly one artifact for every required role is required"
                  )
              for artifact in attempt_artifacts:
                  _validate_artifact(artifact, root)
                  relative = artifact["path"]
                  if relative in seen_attempt_artifact_paths:
                      raise CaptureError(
                          f"attempt {attempt_id}: artifact path is reused across attempts: {relative}"
                      )
                  seen_attempt_artifact_paths.add(relative)
              before, before_ts = validate_state(
          ''',
          )

          replace_once(
              gate_path,
              '''        attempt["state_before"] = before
              attempt["state_after"] = after
              if result == "inconsistent":
                  inconsistent_fingerprints.append(inconsistency_fingerprint(attempt))
          ''',
              '''        attempt["state_before"] = before
              attempt["state_after"] = after
              fingerprint = inconsistency_fingerprint(attempt)
              if result == "inconsistent" and fingerprint is None:
                  raise CaptureError(
                      f"attempt {attempt_id}: declared inconsistent result is not supported by visible state"
                  )
              if result == "consistent" and fingerprint is not None:
                  raise CaptureError(
                      f"attempt {attempt_id}: declared consistent result conflicts with visible state"
                  )
              if fingerprint is not None and result != "inconclusive":
                  inconsistent_fingerprints.append(fingerprint)
          ''',
          )

          runner_path = "scripts/lotus_playwright_capture.py"
          replace_once(
              runner_path,
              '''            "authenticated": bool(args.authenticated),
          ''',
              '''            "authenticated": False,
          ''',
          )
          replace_once(
              runner_path,
              '''    if attempt.get("safety", {}).get("reservation_created") is not False:
              raise RunnerError(f"{attempt_path}: reservation_created must remain false")
              for name in REQUIRED_CHECKPOINTS:
          ''',
              '''    if attempt.get("safety", {}).get("reservation_created") is not False:
              raise RunnerError(f"{attempt_path}: reservation_created must remain false")
              if attempt.get("environment", {}).get("authenticated") is not False:
                  raise RunnerError(f"{attempt_path}: authenticated must remain false")
              for name in REQUIRED_CHECKPOINTS:
          ''',
          )
          replace_once(
              runner_path,
              '''    capture_attempts = []
              for attempt in attempts:
                  capture_attempts.append(
                      {
                          "attempt_id": attempt["attempt_id"],
                          "context_id": attempt["context_id"],
                          "result": attempt["result"],
                          "state_before": attempt["checkpoints"]["before"]["state"],
                          "state_after": attempt["checkpoints"]["after_history"]["state"],
                      }
                  )
          ''',
              '''    capture_attempts = []
              for directory, attempt in zip(attempt_dirs, attempts):
                  before = attempt["checkpoints"]["before"]
                  after = attempt["checkpoints"]["after_history"]
                  network = attempt["artifacts"]["network_archive"]
                  trace = attempt["artifacts"]["transition_trace"]
                  attempt_artifacts = [
                      final_artifact(
                          "screenshot_before",
                          safe_child(directory, before["screenshot_path"]),
                          args.output_root,
                      ),
                      final_artifact(
                          "screenshot_after",
                          safe_child(directory, after["screenshot_path"]),
                          args.output_root,
                      ),
                      final_artifact(
                          "network_archive",
                          safe_child(directory, network["path"]),
                          args.output_root,
                      ),
                      final_artifact(
                          "state_before",
                          safe_child(directory, before["state_path"]),
                          args.output_root,
                      ),
                      final_artifact(
                          "state_after",
                          safe_child(directory, after["state_path"]),
                          args.output_root,
                      ),
                      final_artifact(
                          "transition_trace",
                          safe_child(directory, trace["path"]),
                          args.output_root,
                      ),
                  ]
                  capture_attempts.append(
                      {
                          "attempt_id": attempt["attempt_id"],
                          "context_id": attempt["context_id"],
                          "result": attempt["result"],
                          "state_before": before["state"],
                          "state_after": after["state"],
                          "artifacts": attempt_artifacts,
                      }
                  )
          ''',
          )
          replace_once(
              runner_path,
              '''    run_parser.add_argument("--authenticated", action="store_true")
          ''',
              '''''',
          )

          session_path = "scripts/lotus_airbnb_capture_session.py"
          replace_once(
              session_path,
              '''    if args.authenticated:
                  command.append("--authenticated")
              return command
          ''',
              '''    return command
          ''',
          )
          replace_once(
              session_path,
              '''    parser.add_argument("--authenticated", action="store_true")
          ''',
              '''''',
          )

          gate_tests = "tests/test_lotus_capture_gate.py"
          replace_once(
              gate_tests,
              '''            capture["attempts"][1]["state_after"]["display_total"] = "19000"
              result = gate.validate_capture(self.spec, capture, root)
          ''',
              '''            capture["attempts"][1]["state_after"]["display_currency"] = "TRY"
              capture["attempts"][1]["state_after"]["display_total"] = "19000"
              result = gate.validate_capture(self.spec, capture, root)
          ''',
          )
          replace_once(
              gate_tests,
              '''    def test_sha_mismatch_is_rejected(self) -> None:
          ''',
              '''    def test_authenticated_capture_is_rejected(self) -> None:
                  """The public capture profile must reject authenticated evidence."""
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      capture = self._executed_capture(root)
                      capture["environment"]["authenticated"] = True
                      with self.assertRaisesRegex(gate.CaptureError, "must remain false"):
                          gate.validate_capture(self.spec, capture, root)

              def test_attempt_artifacts_are_required_and_cannot_be_reused(self) -> None:
                  """F3 requires distinct evidence files for each browser context."""
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      capture = self._executed_capture(root)
                      capture["attempts"][0].pop("artifacts")
                      with self.assertRaisesRegex(gate.CaptureError, "artifacts must be a list"):
                          gate.validate_capture(self.spec, capture, root)
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      capture = self._executed_capture(root)
                      capture["attempts"][1]["artifacts"][0]["path"] = (
                          capture["attempts"][0]["artifacts"][0]["path"]
                      )
                      capture["attempts"][1]["artifacts"][0]["sha256"] = (
                          capture["attempts"][0]["artifacts"][0]["sha256"]
                      )
                      with self.assertRaisesRegex(gate.CaptureError, "reused across attempts"):
                          gate.validate_capture(self.spec, capture, root)

              def test_self_declared_inconsistency_requires_visible_state_support(self) -> None:
                  """A declared result alone cannot promote an attempt toward F3."""
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      capture = self._executed_capture(root)
                      capture["attempts"][0]["state_after"]["display_total"] = "19000"
                      with self.assertRaisesRegex(gate.CaptureError, "not supported by visible state"):
                          gate.validate_capture(self.spec, capture, root)

              def test_sha_mismatch_is_rejected(self) -> None:
          ''',
          )
          replace_once(
              gate_tests,
              '''        return {
          ''',
              '''        for attempt in attempts:
                  attempt_artifacts = []
                  for role in sorted(gate.REQUIRED_ARTIFACT_ROLES):
                      path = root / f"{attempt['attempt_id']}-{role}.txt"
                      path.write_text(
                          f"independent evidence for {attempt['attempt_id']} {role}\\n",
                          encoding="utf-8",
                      )
                      attempt_artifacts.append(
                          {"role": role, "path": path.name, "sha256": digest(path)}
                      )
                  attempt["artifacts"] = attempt_artifacts

              return {
          ''',
          )

          playwright_tests = "tests/test_lotus_playwright_capture.py"
          replace_once(
              playwright_tests,
              '''            self.assertEqual(
                  roles,
                  {
                      "screenshot_before",
                      "screenshot_after",
                      "network_archive",
                      "state_before",
                      "state_after",
                      "transition_trace",
                  },
              )
              result = gate.validate_capture(
          ''',
              '''            expected_roles = {
                  "screenshot_before",
                  "screenshot_after",
                  "network_archive",
                  "state_before",
                  "state_after",
                  "transition_trace",
              }
              self.assertEqual(roles, expected_roles)
              seen_paths = set()
              for attempt in capture["attempts"]:
                  attempt_roles = {item["role"] for item in attempt["artifacts"]}
                  self.assertEqual(attempt_roles, expected_roles)
                  attempt_paths = {item["path"] for item in attempt["artifacts"]}
                  self.assertTrue(seen_paths.isdisjoint(attempt_paths))
                  seen_paths.update(attempt_paths)
              result = gate.validate_capture(
          ''',
          )

          session_tests = "tests/test_lotus_airbnb_capture_session.py"
          replace_once(
              session_tests,
              '''        authenticated=False,
          ''',
              '''''',
          )
          replace_once(
              session_tests,
              '''        self.assertIn("--acknowledge-safe-scope", command)
              self.assertNotIn("shell=True", command)
          ''',
              '''        self.assertIn("--acknowledge-safe-scope", command)
              self.assertNotIn("--authenticated", command)
              self.assertNotIn("shell=True", command)
          ''',
          )
          PY

      - name: Validate hardened contracts
        run: |
          python3 -m py_compile \
            scripts/lotus_capture_gate.py \
            scripts/lotus_playwright_capture.py \
            scripts/lotus_airbnb_capture_session.py
          python3 -m unittest \
            tests/test_lotus_evidence.py \
            tests/test_lotus_capture_gate.py \
            tests/test_lotus_playwright_capture.py \
            tests/test_lotus_airbnb_capture_session.py -v
          python3 scripts/lotus_playwright_capture.py plan \
            --profile integrations/lotus/capture/airbnb-currency-atomicity-v0.1.json \
            --capture-template integrations/lotus/examples/airbnb-run-002.capture.json >/tmp/lotus-plan.json

      - name: Commit verified fix and remove temporary workflow
        run: |
          rm .github/workflows/codex-fix-lotus-evidence.yml
          git config user.name "Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/lotus_capture_gate.py \
            scripts/lotus_playwright_capture.py \
            scripts/lotus_airbnb_capture_session.py \
            tests/test_lotus_capture_gate.py \
            tests/test_lotus_playwright_capture.py \
            tests/test_lotus_airbnb_capture_session.py \
            .github/workflows/codex-fix-lotus-evidence.yml
          git commit -m "fix: harden Lotus capture independence"
          git push origin HEAD:agent/lotus-evidence-vertical-slice
