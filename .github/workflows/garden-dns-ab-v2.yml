name: Garden DNS A-B v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/garden-dns-ab-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garden-dns-ab-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  GARDEN_SHA: 9c43a78082d8bf943dd8d11e741b9a0c7cc61f65
  ROOTFS_IMAGE: mcr.microsoft.com/playwright/python:v1.60.0-noble

jobs:
  dns:
    name: DNS in Docker chroot vs Garden
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Garden
        uses: actions/checkout@v4
        with:
          repository: safal207/GardenLiminal
          ref: ${{ env.GARDEN_SHA }}
          path: vendor/GardenLiminal
          persist-credentials: false

      - name: Build exact Garden
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/GardenLiminal rev-parse HEAD)" = "$GARDEN_SHA"
          mkdir -p reports/dns-v2/{rootfs,garden-image,network-files,evidence}
          sudo apt-get update -qq
          sudo apt-get install -y -qq libseccomp-dev pkg-config
          build_root="$RUNNER_TEMP/GardenLiminal-dns-v2"
          cp -a vendor/GardenLiminal "$build_root"
          cd "$build_root"
          cargo build --release 2>&1 | tee "$GITHUB_WORKSPACE/reports/dns-v2/cargo-build.log"
          cargo test 2>&1 | tee "$GITHUB_WORKSPACE/reports/dns-v2/cargo-test.log"
          cp target/release/gl "$GITHUB_WORKSPACE/reports/dns-v2/garden-image/gl"

      - name: Export rootfs and capture live Docker network files
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ROOTFS_IMAGE"

          export_id="$(docker create "$ROOTFS_IMAGE" /bin/true)"
          source_name="dns-source-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$export_id" "$source_name" >/dev/null 2>&1 || true' EXIT
          docker export "$export_id" -o reports/dns-v2/rootfs.tar
          sudo tar -xf reports/dns-v2/rootfs.tar -C reports/dns-v2/rootfs

          # Docker injects resolv.conf, hosts and hostname only for a running
          # container. Capture them from a live container on the same default
          # bridge used by both baseline and Garden harness runs.
          docker run -d --name "$source_name" "$ROOTFS_IMAGE" sleep 300 >/dev/null
          for file in resolv.conf hosts hostname; do
            docker exec "$source_name" cat "/etc/$file" > "reports/dns-v2/network-files/$file"
            test -s "reports/dns-v2/network-files/$file"
            sudo cp "reports/dns-v2/network-files/$file" "reports/dns-v2/rootfs/etc/$file"
          done

          dev=reports/dns-v2/rootfs/dev
          sudo mkdir -p "$dev" "$dev/pts" "$dev/shm" reports/dns-v2/rootfs/opt/diagnostic reports/dns-v2/rootfs/evidence
          for entry in null zero random urandom; do sudo rm -f "$dev/$entry"; done
          sudo mknod -m 666 "$dev/null" c 1 3
          sudo mknod -m 666 "$dev/zero" c 1 5
          sudo mknod -m 666 "$dev/random" c 1 8
          sudo mknod -m 666 "$dev/urandom" c 1 9
          sudo ln -sfn /proc/self/fd "$dev/fd"
          sudo ln -sfn /proc/self/fd/0 "$dev/stdin"
          sudo ln -sfn /proc/self/fd/1 "$dev/stdout"
          sudo ln -sfn /proc/self/fd/2 "$dev/stderr"

          cat > /tmp/dns-probe.py <<'PY'
          import json
          import socket
          import traceback
          from pathlib import Path

          result = {
              "resolv_conf": Path("/etc/resolv.conf").read_text(errors="replace"),
              "hosts": Path("/etc/hosts").read_text(errors="replace"),
              "addresses": [],
              "error": None,
          }
          try:
              rows = socket.getaddrinfo("www.airbnb.com", 443, type=socket.SOCK_STREAM)
              result["addresses"] = sorted({row[4][0] for row in rows})
          except Exception as exc:
              result["error"] = {
                  "type": type(exc).__name__,
                  "message": str(exc),
                  "traceback": traceback.format_exc(),
              }
          Path("/evidence").mkdir(parents=True, exist_ok=True)
          Path("/evidence/dns-result.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2), flush=True)
          raise SystemExit(0 if result["addresses"] else 1)
          PY
          sudo cp /tmp/dns-probe.py reports/dns-v2/rootfs/opt/diagnostic/dns-probe.py
          sudo chmod -R a+rX reports/dns-v2/rootfs/opt/diagnostic

      - name: Baseline DNS in matching Docker namespace without Garden
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 45 docker run --rm \
            --privileged \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE/reports/dns-v2/rootfs:/work/rootfs:rw" \
            ubuntu:24.04 \
            chroot /work/rootfs /usr/bin/python /opt/diagnostic/dns-probe.py \
            > reports/dns-v2/baseline.log 2>&1
          code=$?
          set -e
          echo "$code" > reports/dns-v2/baseline.exit
          cat reports/dns-v2/baseline.log
          if [ -f reports/dns-v2/rootfs/evidence/dns-result.json ]; then
            sudo cp reports/dns-v2/rootfs/evidence/dns-result.json reports/dns-v2/baseline-result.json
            sudo rm -f reports/dns-v2/rootfs/evidence/dns-result.json
          fi

      - name: Build Garden harness and Seed
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/dns-v2/garden-image/Dockerfile <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                   libseccomp2 ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          COPY gl /opt/garden/gl
          RUN chmod 0755 /opt/garden/gl
          ENTRYPOINT ["/opt/garden/gl"]
          DOCKERFILE
          docker build -t garden-dns-v2:${GITHUB_SHA} reports/dns-v2/garden-image

          cat > reports/dns-v2/seed.yaml <<'YAML'
          apiVersion: v0
          kind: Seed
          meta:
            name: garden-dns-v2
            id: garden-dns-v2-001
          rootfs:
            path: /work/rootfs
          entrypoint:
            cmd:
              - /usr/bin/python
              - /opt/diagnostic/dns-probe.py
            env:
              - HOME=/tmp
              - PYTHONUNBUFFERED=1
            cwd: /
          mounts:
            - type: proc
              target: /proc
            - type: tmpfs
              target: /tmp
            - type: tmpfs
              target: /dev/shm
          security:
            hostname: dns-v2
            drop_caps: ["NET_ADMIN", "SYS_ADMIN"]
            seccomp_profile: default
          user:
            uid: 0
            gid: 0
            map_rootless: false
          store:
            kind: mem
          YAML

      - name: Run DNS inside Garden in matching Docker namespace
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 60 docker run --rm \
            --privileged \
            --pids-limit 128 \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE/reports/dns-v2/rootfs:/work/rootfs:rw" \
            -v "$GITHUB_WORKSPACE/reports/dns-v2/seed.yaml:/work/seed.yaml:ro" \
            garden-dns-v2:${GITHUB_SHA} run -f /work/seed.yaml --store mem \
            > reports/dns-v2/garden.log 2>&1
          code=$?
          set -e
          echo "$code" > reports/dns-v2/garden.exit
          cat reports/dns-v2/garden.log
          if [ -f reports/dns-v2/rootfs/evidence/dns-result.json ]; then
            sudo cp reports/dns-v2/rootfs/evidence/dns-result.json reports/dns-v2/garden-result.json
            sudo chown "$(id -u):$(id -g)" reports/dns-v2/garden-result.json
          fi

      - name: Classify DNS boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("reports/dns-v2")
          baseline_code = int((root / "baseline.exit").read_text())
          garden_code = int((root / "garden.exit").read_text())
          baseline = json.loads((root / "baseline-result.json").read_text()) if (root / "baseline-result.json").exists() else None
          garden = json.loads((root / "garden-result.json").read_text()) if (root / "garden-result.json").exists() else None
          if baseline_code == 0 and garden_code == 0:
              boundary = "DNS_CONFIRMED_INSIDE_GARDEN"
          elif baseline_code == 0 and garden_code != 0:
              boundary = "GARDEN_SECCOMP_OR_RUNTIME_DNS_BLOCK"
          else:
              boundary = "NETWORK_CONFIGURATION_INVALID_BEFORE_GARDEN"
          result = {
              "schema_version": "garden-dns-ab-v0.2",
              "garden_commit": "9c43a78082d8bf943dd8d11e741b9a0c7cc61f65",
              "baseline_exit": baseline_code,
              "garden_exit": garden_code,
              "baseline_result": baseline,
              "garden_result": garden,
              "boundary": boundary,
              "airbnb_http_navigation": False,
              "authority": {"mode":"runtime_diagnostic_only","external_submission":False,"deployment":False,"merge":False},
          }
          (root / "result.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2))
          if boundary != "DNS_CONFIRMED_INSIDE_GARDEN":
              raise SystemExit(1)
          PY

      - name: Remove rootfs and hash evidence
        if: always()
        shell: bash
        run: |
          sudo rm -rf reports/dns-v2/rootfs
          rm -f reports/dns-v2/rootfs.tar
          find reports/dns-v2 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > reports/dns-v2/SHA256SUMS.txt

      - name: Upload DNS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-dns-ab-v2-${{ github.run_id }}
          path: reports/dns-v2/
          if-no-files-found: error
          retention-days: 14
