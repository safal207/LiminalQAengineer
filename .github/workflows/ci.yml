name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Job 1: Run all tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Run tests
        run: cargo test --all-features --workspace --verbose

      - name: Run doc tests
        run: cargo test --doc --workspace

  # Job 2: Capture exact formatter output for the current Codex fix.
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply formatting
        run: cargo fmt --all

      - name: Upload exact formatted source
        uses: actions/upload-artifact@v4
        with:
          name: impact-selector-rustfmt-${{ github.run_id }}
          path: liminalqa-runner/src/impact.rs
          if-no-files-found: error

      - name: Report whether the branch was already formatted
        run: git diff --exit-code

  # Job 3: Lint with Clippy
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  # Job 4: Build check
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Build all packages
        run: cargo build --release --all-features --workspace

      - name: Check binary size
        run: |
          ls -lh target/release/ | grep -E 'limctl|liminalqa'
