name: TakeProfit Exact-Attempt Public Recheck

on:
  workflow_dispatch:
  push:
    branches:
      - agent/takeprofit-public-identity-audit-v0-1
    paths:
      - .github/workflows/takeprofit-public-recheck.yml
      - audits/lighthouse/takeprofit/domains.json
      - audits/lighthouse/takeprofit/lighthouserc.cjs
      - audits/lighthouse/takeprofit/policy.json
      - scripts/lighthouse_to_liminalqa.py
      - scripts/lighthouse_portfolio_summary.py
  pull_request:
    branches:
      - agent/takeprofit-lighthouse-audit
    paths:
      - .github/workflows/takeprofit-public-recheck.yml
      - audits/lighthouse/takeprofit/domains.json
      - audits/lighthouse/takeprofit/lighthouserc.cjs
      - audits/lighthouse/takeprofit/policy.json
      - scripts/lighthouse_to_liminalqa.py
      - scripts/lighthouse_portfolio_summary.py

permissions:
  contents: read

concurrency:
  group: takeprofit-exact-recheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Validate exact public inventory
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate inventory and boundaries
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          inventory="audits/lighthouse/takeprofit/domains.json"
          policy="audits/lighthouse/takeprofit/policy.json"
          python3 -m json.tool "${inventory}" >/dev/null
          python3 -m json.tool "${policy}" >/dev/null
          jq -e '
            (.targets | length) == 6 and
            .scope_kind == "passive_public_quality" and
            .boundaries.public_pages_only == true and
            .boundaries.active_security_testing == false and
            .boundaries.authenticated_testing == false and
            .boundaries.api_testing == false and
            .boundaries.financial_operations == false and
            .boundaries.fuzzing == false and
            .boundaries.load_testing == false and
            ([.targets[].url | startswith("https://takeprofit.com/")] | all) and
            ([.targets[].slug] | length == (unique | length))
          ' "${inventory}" >/dev/null
          while IFS= read -r url; do
            python3 scripts/lighthouse_to_liminalqa.py validate-url \
              --policy "${policy}" \
              --url "${url}" >/dev/null
          done < <(jq -r '.targets[].url' "${inventory}")
          matrix="$(jq -c '{include: [.targets[] | {slug: .slug, url: .url}]}' "${inventory}")"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  audit:
    name: Recheck · ${{ matrix.slug }}
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      LIGHTHOUSE_TARGET_URL: ${{ matrix.url }}

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate exact matrix member
        shell: bash
        run: |
          set -euo pipefail
          jq -e \
            --arg slug "${{ matrix.slug }}" \
            --arg url "${{ matrix.url }}" \
            '.targets[] | select(.slug == $slug and .url == $url)' \
            audits/lighthouse/takeprofit/domains.json >/dev/null
          python3 scripts/lighthouse_to_liminalqa.py validate-url \
            --policy audits/lighthouse/takeprofit/policy.json \
            --url "${{ matrix.url }}" >/dev/null

      - name: Validate runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          python3 --version
          python3 -m py_compile \
            scripts/lighthouse_to_liminalqa.py \
            scripts/lighthouse_portfolio_summary.py

      - name: Collect passive Lighthouse evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lighthouseci reports/lighthouse reports/recheck-domain
          output="reports/recheck-domain/${{ matrix.slug }}"
          mkdir -p "${output}"
          npx --yes @lhci/cli@0.15.1 autorun \
            --config=audits/lighthouse/takeprofit/lighthouserc.cjs
          python3 scripts/lighthouse_to_liminalqa.py report \
            --policy audits/lighthouse/takeprofit/policy.json \
            --input-dir .lighthouseci \
            --output-dir "${output}"
          sed -i \
            's/LiminalQA · Tradernet public Lighthouse audit/LiminalQA · TakeProfit exact-attempt public recheck/' \
            "${output}/summary.md"
          mkdir -p "${output}/raw-lhci"
          cp -R .lighthouseci/. "${output}/raw-lhci/"
          cat "${output}/summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Record exact attempt manifest
        shell: bash
        run: |
          set -euo pipefail
          output="reports/recheck-domain/${{ matrix.slug }}"
          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg head_sha "${{ github.sha }}" \
            --arg slug "${{ matrix.slug }}" \
            --arg url "${{ matrix.url }}" \
            '{run_id:$run_id,run_attempt:$run_attempt,head_sha:$head_sha,slug:$slug,url:$url}' \
            > "${output}/exact-attempt.json"
          sha256sum "${output}/decision-packet.json" "${output}/summary.md" "${output}/exact-attempt.json" \
            > "${output}/SHA256SUMS.txt"

      - name: Upload exact-attempt domain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takeprofit-recheck-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slug }}
          path: reports/recheck-domain/${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate exact-attempt TakeProfit packet
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download only this exact attempt
        uses: actions/download-artifact@v4
        with:
          pattern: takeprofit-recheck-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: downloaded-exact-attempt

      - name: Enforce six fresh packets
        shell: bash
        run: |
          set -euo pipefail
          count="$(find downloaded-exact-attempt -name decision-packet.json -type f | wc -l)"
          test "${count}" -eq 6
          while IFS= read -r manifest; do
            jq -e \
              --arg run_id "${{ github.run_id }}" \
              --arg run_attempt "${{ github.run_attempt }}" \
              --arg head_sha "${{ github.sha }}" \
              '.run_id == $run_id and .run_attempt == $run_attempt and .head_sha == $head_sha' \
              "${manifest}" >/dev/null
          done < <(find downloaded-exact-attempt -name exact-attempt.json -type f)

      - name: Build fresh portfolio summary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lighthouse_portfolio_summary.py \
            --input-dir downloaded-exact-attempt \
            --output-dir reports/takeprofit-public-recheck
          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg head_sha "${{ github.sha }}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{run_id:$run_id,run_attempt:$run_attempt,head_sha:$head_sha,generated_at:$generated_at,coordinate_center:"O = URL + viewport + unauthenticated state + observation time",observer:"passive Lighthouse browser"}' \
            > reports/takeprofit-public-recheck/exact-attempt-manifest.json
          sha256sum reports/takeprofit-public-recheck/* \
            > reports/takeprofit-public-recheck/SHA256SUMS.txt
          cat reports/takeprofit-public-recheck/portfolio-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload fresh aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: takeprofit-recheck-portfolio-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/takeprofit-public-recheck/
          if-no-files-found: error
          retention-days: 30
