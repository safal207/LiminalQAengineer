name: Garden Node Spawn CI v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/garden-node-spawn-ci-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garden-node-spawn-ci-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  GARDEN_SHA: 6eda85415feae21af117aa09125dcc88a1a3f9c1
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright/python:v1.60.0-noble

jobs:
  node-spawn:
    name: Exact Playwright Node spawn under Garden
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: safal207/GardenLiminal
          ref: ${{ env.GARDEN_SHA }}
          path: vendor/GardenLiminal
          persist-credentials: false

      - name: Build exact Garden
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/node-v2/{rootfs,garden-image,probe-image}
          sudo apt-get update -qq
          sudo apt-get install -y -qq libseccomp-dev pkg-config
          build_root="$RUNNER_TEMP/GardenLiminal-node-v2"
          cp -a vendor/GardenLiminal "$build_root"
          cd "$build_root"
          cargo build --release 2>&1 | tee "$GITHUB_WORKSPACE/reports/node-v2/cargo-build.log"
          cargo test 2>&1 | tee "$GITHUB_WORKSPACE/reports/node-v2/cargo-test.log"
          cp target/release/gl "$GITHUB_WORKSPACE/reports/node-v2/garden-image/gl"

      - name: Export exact Playwright Python driver and browsers
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/node-v2/probe-image/Dockerfile <<DOCKERFILE
          FROM ${PLAYWRIGHT_IMAGE}
          RUN python -m pip install --no-cache-dir playwright==1.60.0
          RUN mkdir -p /opt/liminal-playwright \
              && cp -a /ms-playwright/. /opt/liminal-playwright/
          DOCKERFILE
          docker build -t garden-node-v2-rootfs:${GITHUB_SHA} \
            reports/node-v2/probe-image \
            2>&1 | tee reports/node-v2/probe-image-build.log
          id="$(docker create garden-node-v2-rootfs:${GITHUB_SHA} /bin/true)"
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          docker export "$id" -o reports/node-v2/rootfs.tar
          sudo tar -xf reports/node-v2/rootfs.tar -C reports/node-v2/rootfs

          browser_host="$(find reports/node-v2/rootfs/opt/liminal-playwright \
            -type f -name chrome-headless-shell -perm -111 -print -quit)"
          node_host="$(find reports/node-v2/rootfs/usr/local/lib \
            -type f -path '*/playwright/driver/node' -perm -111 -print -quit)"
          test -n "$browser_host"
          test -n "$node_host"
          browser_inside="/${browser_host#reports/node-v2/rootfs/}"
          node_inside="/${node_host#reports/node-v2/rootfs/}"

          sudo mkdir -p reports/node-v2/rootfs/opt/diagnostic
          cat > /tmp/node-spawn.js <<'JS'
          const { spawnSync } = require('child_process');
          const fs = require('fs');
          const browser = fs.readFileSync('/opt/diagnostic/browser-path.txt', 'utf8').trim();
          const result = spawnSync(browser, ['--version'], { encoding: 'utf8' });
          console.log(JSON.stringify({
            status: result.status,
            signal: result.signal,
            error: result.error ? {code: result.error.code, errno: result.error.errno, message: result.error.message} : null,
            stdout: result.stdout,
            stderr: result.stderr
          }));
          process.exit(result.status === 0 ? 0 : 1);
          JS
          sudo cp /tmp/node-spawn.js reports/node-v2/rootfs/opt/diagnostic/node-spawn.js
          printf '%s\n' "$browser_inside" | sudo tee reports/node-v2/rootfs/opt/diagnostic/browser-path.txt >/dev/null
          printf '%s\n' "$browser_inside" > reports/node-v2/browser-path.txt
          printf '%s\n' "$node_inside" > reports/node-v2/node-path.txt

          set +e
          timeout 30 sudo chroot reports/node-v2/rootfs "$node_inside" /opt/diagnostic/node-spawn.js \
            > reports/node-v2/chroot-node-spawn.log 2>&1
          code=$?
          set -e
          echo "$code" > reports/node-v2/chroot-node-spawn.exit
          cat reports/node-v2/chroot-node-spawn.log
          test "$code" = 0

      - name: Build Garden harness and Seed
        shell: bash
        run: |
          set -euo pipefail
          cat > reports/node-v2/garden-image/Dockerfile <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                   libseccomp2 ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          COPY gl /opt/garden/gl
          RUN chmod 0755 /opt/garden/gl
          ENTRYPOINT ["/opt/garden/gl"]
          DOCKERFILE
          docker build -t garden-node-v2:${GITHUB_SHA} reports/node-v2/garden-image

          node="$(cat reports/node-v2/node-path.txt)"
          cat > reports/node-v2/seed.yaml <<YAML
          apiVersion: v0
          kind: Seed
          meta:
            name: exact-playwright-node-spawn
            id: exact-playwright-node-spawn-001
          rootfs:
            path: /work/rootfs
          entrypoint:
            cmd:
              - ${node}
              - /opt/diagnostic/node-spawn.js
            env:
              - HOME=/tmp
            cwd: /
          mounts:
            - type: proc
              target: /proc
            - type: tmpfs
              target: /tmp
            - type: tmpfs
              target: /dev/shm
          security:
            hostname: node-v2
            drop_caps: ["NET_ADMIN", "SYS_ADMIN"]
            seccomp_profile: default
          user:
            uid: 0
            gid: 0
            map_rootless: false
          store:
            kind: mem
          YAML

      - name: Run exact Node spawn inside Garden
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 90 docker run --rm \
            --privileged \
            --pids-limit 128 \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE/reports/node-v2/rootfs:/work/rootfs:rw" \
            -v "$GITHUB_WORKSPACE/reports/node-v2/seed.yaml:/work/seed.yaml:ro" \
            garden-node-v2:${GITHUB_SHA} run -f /work/seed.yaml --store mem \
            > reports/node-v2/run.log 2>&1
          code=$?
          set -e
          echo "$code" > reports/node-v2/run.exit
          cat reports/node-v2/run.log

      - name: Validate result
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat reports/node-v2/chroot-node-spawn.exit)" = 0
          test "$(cat reports/node-v2/run.exit)" = 0
          grep -q '"event":"SECCOMP_ENABLED"' reports/node-v2/run.log
          grep -q '"event":"PROCESS_EXIT"' reports/node-v2/run.log
          grep -q '"code":0' reports/node-v2/run.log
          grep -q '"status":0' reports/node-v2/run.log
          ! grep -q 'ENOENT' reports/node-v2/run.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/node-v2')
          result = {
              'schema_version': 'garden-node-spawn-ci-v2',
              'garden_commit': '6eda85415feae21af117aa09125dcc88a1a3f9c1',
              'chroot_exit': int((root / 'chroot-node-spawn.exit').read_text()),
              'garden_exit': int((root / 'run.exit').read_text()),
              'exact_playwright_node_spawn_confirmed': True,
              'airbnb_navigation': False,
              'authority': {'mode':'runtime_diagnostic_only','external_submission':False,'deployment':False,'merge':False},
          }
          (root / 'result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Remove rootfs and hash evidence
        if: always()
        shell: bash
        run: |
          sudo rm -rf reports/node-v2/rootfs
          rm -f reports/node-v2/rootfs.tar
          find reports/node-v2 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > reports/node-v2/SHA256SUMS.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-node-spawn-ci-v2-${{ github.run_id }}
          path: reports/node-v2/
          if-no-files-found: error
          retention-days: 14
