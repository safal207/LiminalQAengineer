name: Revolut Public Content Recheck v0.2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/revolut-public-recheck-v0-2
    paths:
      - .github/workflows/revolut-public-content-recheck-v0-2.yml
      - audits/browser/revolut/public-content-recheck-v0.2.json
      - scripts/revolut_public_content_recheck.mjs
  pull_request:
    branches:
      - agent/revolut-docker-full-validation-v0-1
      - main
    paths:
      - .github/workflows/revolut-public-content-recheck-v0-2.yml
      - audits/browser/revolut/public-content-recheck-v0.2.json
      - scripts/revolut_public_content_recheck.mjs

permissions:
  contents: read

concurrency:
  group: revolut-public-content-recheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Observe Revolut public content and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate bounded configuration
        shell: bash
        run: |
          set -euo pipefail
          config="audits/browser/revolut/public-content-recheck-v0.2.json"
          python3 -m json.tool "${config}" >/dev/null
          jq -e '
            .schema_version == "liminalqa-revolut-public-content-recheck-v0.2" and
            (.targets | length) == 3 and
            (.profiles | length) == 2 and
            ([.targets[].url | startswith("https://")] | all) and
            .boundaries.public_pages_only == true and
            .boundaries.natural_navigation_only == true and
            .boundaries.passive_browser_observation == true and
            .boundaries.authenticated_testing == false and
            .boundaries.account_access == false and
            .boundaries.direct_api_testing == false and
            .boundaries.form_submission == false and
            .boundaries.trading_actions == false and
            .boundaries.financial_operations == false and
            .boundaries.fuzzing == false and
            .boundaries.load_testing == false and
            .boundaries.active_security_testing == false and
            .boundaries.server_state_change == false
          ' "${config}" >/dev/null

      - name: Confirm current official Revolut X upstream head
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote https://github.com/revolut-engineering/revolut-x-api.git refs/heads/master \
            > revolut-upstream-head.txt
          test "$(awk '{print $1}' revolut-upstream-head.txt)" = "13778de69e0411ee11198dc913a3b9b0f72ac880"

      - name: Install pinned browser driver
        run: npm install --no-save --package-lock=false puppeteer-core@24.16.0

      - name: Validate runtime and locate Chrome
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/revolut_public_content_recheck.mjs
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "${chrome}"
          "${chrome}" --version
          echo "chrome=${chrome}" >> "${GITHUB_OUTPUT}"

      - name: Run bounded public content matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reports/revolut-public-content
          node scripts/revolut_public_content_recheck.mjs \
            --config audits/browser/revolut/public-content-recheck-v0.2.json \
            --chrome "${{ steps.runtime.outputs.chrome }}" \
            --output-dir reports/revolut-public-content
          cp revolut-upstream-head.txt reports/revolut-public-content/
          cat reports/revolut-public-content/revolut-public-content-recheck-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate evidence and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          result="reports/revolut-public-content/revolut-public-content-recheck-result.json"
          jq -e '
            .schema_version == "liminalqa-revolut-public-content-recheck-result-v0.2" and
            (.observations | length) == 6 and
            .authority.mode == "evidence_only" and
            .authority.grants.ownership == false and
            .authority.grants.approval == false and
            .authority.grants.execution == false and
            .authority.grants.external_submission == false and
            .authority.grants.delivery == false and
            .authority.grants.deployment == false and
            .authority.grants.merge == false
          ' "${result}" >/dev/null
          ! grep -R -E -i 'authorization: bearer [A-Za-z0-9._-]{20,}|cookie:|set-cookie:|access_token|refresh_token|sessionid' \
            reports/revolut-public-content \
            --exclude='*.png'

      - name: Record exact attempt manifest
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg head_sha "${{ github.sha }}" \
            --arg upstream_sha "$(awk '{print $1}' revolut-upstream-head.txt)" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{run_id:$run_id,run_attempt:$run_attempt,head_sha:$head_sha,upstream_sha:$upstream_sha,generated_at:$generated_at}' \
            > reports/revolut-public-content/exact-attempt.json
          sha256sum reports/revolut-public-content/* \
            > reports/revolut-public-content/ARTIFACT_SHA256SUMS.txt

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revolut-public-content-recheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/revolut-public-content/
          if-no-files-found: error
          retention-days: 30
